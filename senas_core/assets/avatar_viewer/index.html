<!DOCTYPE html>
<!--
  Visor del avatar VRM. Corre dentro de un WebView (webview_flutter), cargado
  como asset local de Flutter (avatar_bridge.dart). No es parte del proyecto
  npm de nadie: es una pagina suelta que importa three.js y three-vrm como
  modulos ES directamente desde un CDN.

  OJO: esto necesita internet la primera vez que se abre la pantalla del
  avatar (para bajar las librerias del CDN). Si el telefono lo abre offline
  la primera vez, el visor va a quedar en blanco. Una vez que el WebView las
  cachea puede que sigan andando offline, pero no esta garantizado. Si esto
  llega a ser un problema, la solucion es bajar three.module.js y
  three-vrm.module.js a mano y ponerlos en assets/avatar_viewer/lib/, y
  cambiar los imports de abajo por rutas locales.

  Como lo maneja Dart (ver avatar_bridge.dart):
    - Flutter llama a window.reproducirSecuencia(seqJson) con una lista de
      frames, cada uno un array de 152 numeros (el mismo formato que usa
      sign_norm.dart / dtw.dart para reconocer).
    - Esta pagina aplica frames al RigBody y renderiza el humanoid VRM a 60 FPS;
      el modo vivo suaviza solo la salida visual.
    - Cuando termina, llama a window.SenasChannel.postMessage('fin') para
      que Dart sepa que puede reproducir la siguiente palabra.
-->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
    #lienzo { width: 100vw; height: 100vh; display: block; }
    #estado {
      position: fixed; left: 8px; bottom: 8px; z-index: 10;
      font: 12px sans-serif; color: #b00; background: #fff8;
      padding: 4px 8px; border-radius: 6px; display: none;
    }
    /* Panel de calibracion. Herramienta de DESARROLLO: cuando los valores
       queden fijos, copiarlos al objeto 'cal' de abajo y borrar este bloque
       junto con el div #ajustes y su script (buscar "PANEL DE CALIBRACION"). */
    #ajustes {
      position: fixed; right: 6px; top: 6px; z-index: 20;
      font: 11px/1.4 sans-serif; color: #222; background: #fffefeee;
      padding: 6px 8px; border-radius: 8px; box-shadow: 0 1px 6px #0004;
      width: 186px;
    }
    #ajustes.oculto #cuerpo { display: none; }
    #ajustes label { display: block; margin-top: 4px; color: #555; }
    #ajustes input[type=range] { width: 100%; margin: 0 0 2px; }
    #ajustes select { width: 100%; font-size: 11px; margin-top: 3px; }
    #ajustes b { font-size: 11px; }
    #tog {
      float: right; border: 0; background: #eee; border-radius: 4px;
      font-size: 12px; padding: 0 7px; cursor: pointer;
    }
    .tabs { display: flex; gap: 4px; margin: 5px 0; }
    .tabs button {
      flex: 1; border: 0; background: #e9e9ef; border-radius: 4px;
      font-size: 11px; padding: 4px 0; cursor: pointer;
    }
    .tabs button.on { background: #3f51b5; color: #fff; }
    .fila { display: flex; gap: 4px; margin: 5px 0; }
    .fila button {
      flex: 1; border: 0; background: #e9e9ef; border-radius: 4px;
      font-size: 10px; padding: 4px 0; cursor: pointer;
    }
    .fila button.on { background: #b71c1c; color: #fff; }
    #bVer {
      width: 100%; border: 0; background: #d7e3d7; border-radius: 4px;
      font-size: 10px; padding: 4px; margin-top: 5px; cursor: pointer;
    }
    #salida {
      width: 100%; height: 76px; margin-top: 4px; font: 9px monospace;
      display: none; border: 1px solid #ccc; border-radius: 4px; resize: none;
    }
    .oculto2 { display: none; }
    #camaraPanel {
      display: none; position: fixed; left: 8px; bottom: 8px; z-index: 25;
      width: 250px; padding: 8px; color: #222; background: #fffefeee;
      border-radius: 8px; box-shadow: 0 1px 6px #0004;
      font: 11px/1.35 sans-serif;
    }
    #camaraVista {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      overflow: hidden; border-radius: 6px; background: #111;
    }
    #camaraVideo, #camaraOverlay {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
    #camaraVideo.espejo, #camaraOverlay.espejo { transform: scaleX(-1); }
    #camaraOverlay { pointer-events: none; }
    #camaraPanel .camaraCabecera {
      display: flex; justify-content: space-between; align-items: center;
      margin: 5px 0;
    }
    #camaraPanel .camaraEstado { color: #555; }
    #camaraPanel .camaraEstado.ok { color: #176b2c; }
    #camaraPanel .camaraEstado.error { color: #a00; }
    #camaraPanel .camaraBotones { display: flex; gap: 4px; }
    #camaraPanel button {
      flex: 1; border: 0; background: #e9e9ef; border-radius: 4px;
      font-size: 10px; padding: 5px 3px; cursor: pointer;
    }
    #camaraPanel button:disabled { opacity: .55; cursor: wait; }
    #camaraStats { color: #555; margin-top: 5px; min-height: 15px; }
    #camaraPanel label { display: inline-flex; gap: 4px; align-items: center; }
    #camaraPanel .camaraAcciones { display: flex; gap: 4px; margin-top: 4px; }
  </style>
</head>
<body>
  <canvas id="lienzo"></canvas>
  <div id="estado"></div>

  <section id="camaraPanel" aria-label="Cámara MediaPipe web">
    <div id="camaraVista">
      <video id="camaraVideo" autoplay muted playsinline></video>
      <canvas id="camaraOverlay"></canvas>
    </div>
    <div class="camaraCabecera">
      <b>MediaPipe web</b>
      <span id="camaraEstado" class="camaraEstado">Apagada</span>
    </div>
    <div class="camaraBotones">
      <button id="bIniciarCamara" type="button">Iniciar cámara</button>
      <button id="bDetenerCamara" type="button" disabled>Detener</button>
    </div>
    <div class="camaraAcciones">
      <button id="bGrabarCamara" type="button" disabled>Grabar 32</button>
      <button id="bRepetirCamara" type="button" disabled>Repetir</button>
      <button id="bDescargarCamara" type="button" disabled>JSON</button>
    </div>
    <label><input id="camaraEspejo" type="checkbox"> Espejar solo vista</label>
    <label><input id="camaraSuavizar" type="checkbox" checked> Suavizar movimiento</label>
    <label><input id="camaraReposoMano" type="checkbox" checked> Volver mano a reposo si se pierde</label>
    <div id="camaraStats">Pose: — · Manos: — · Vector: —</div>
  </section>

  <div id="ajustes">
    <button id="tog">–</button>
    <b>Editor de pose</b>
    <div id="cuerpo">
      <div class="fila">
        <button id="bManual">Congelar datos</button>
        <button id="bCam">Centrar cámara</button>
      </div>

      <div class="tabs" id="tabsVista">
        <button data-vista="huesos">Huesos</button>
        <button data-vista="calib">Calibrar</button>
      </div>

      <!-- Vista: edicion libre de cualquier hueso del rig -->
      <div id="vHuesos">
        <select id="selHueso"></select>
        <label>Inclinación X: <span id="vRx"></span></label>
        <input type="range" id="sRx" min="-3.15" max="3.15" step="0.01">
        <label>Giro Y: <span id="vRy"></span></label>
        <input type="range" id="sRy" min="-3.15" max="3.15" step="0.01">
        <label>Doblez Z: <span id="vRz"></span></label>
        <input type="range" id="sRz" min="-3.15" max="3.15" step="0.01">
        <div class="fila">
          <button id="bCero">Cero este</button>
          <button id="bReposo">Reposo</button>
        </div>
      </div>

      <!-- Vista: las constantes de calibracion del pipeline -->
      <div id="vCalib" class="oculto2">
        <div class="tabs" id="tabsLado">
          <button data-lado="left">Izq</button>
          <button data-lado="right">Der</button>
        </div>
        <label>Giro de palma: <span id="vPal"></span></label>
        <input type="range" id="sPal" min="-3.15" max="3.15" step="0.05">
        <label><input id="sMuneca" type="checkbox" checked> Orientar muñeca 3D</label>
        <div class="fila">
          <button id="bBrazo">Brazo <span id="vBrazo"></span></button>
          <button id="bDedos">Dedos <span id="vDedos"></span></button>
          <button id="bPalma">Palma <span id="vPalS"></span></button>
        </div>
        <label>Reposo (ambos): <span id="vRep"></span></label>
        <input type="range" id="sRep" min="0" max="1.6" step="0.05">
      </div>

      <button id="bVer">Copiar pose</button>
      <textarea id="salida" readonly></textarea>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2/lib/three-vrm.module.min.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils, VRMHumanBoneName } from '@pixiv/three-vrm';

    const standaloneWeb =
      new URLSearchParams(window.location.search).get('standalone') === '1';
    const kMediaPipeVersion = '1.0.1';
    const kMediaPipeWasm =
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' +
      kMediaPipeVersion + '/wasm';
    // Reutiliza los mismos .task que Android. El servidor web sirve senas_core
    // como raiz, por eso esta ruta funciona en scripts/univoz.sh web.
    const kPoseModelWeb = '../../android/app/src/main/assets/pose_landmarker_lite.task';
    const kHandModelWeb = '../../android/app/src/main/assets/hand_landmarker.task';
    const $estado = document.getElementById('estado');
    function avisar(msg) {
      // Errores visibles en el propio WebView: no hay consola a mano en un
      // telefono, asi que si algo se rompe (por ejemplo sin internet la
      // primera vez) al menos se ve un cartel en vez de una pantalla negra
      // muda.
      console.error(msg);
      $estado.textContent = msg;
      $estado.style.display = 'block';
    }

    const webCameraState = {
      running: false,
      loading: false,
      processing: false,
      frames: 0,
      validFrames: 0,
      invalidFrames: 0,
      pose: false,
      leftHand: false,
      rightHand: false,
      smoothing: true,
      quality: 0,
      stale: false,
      staleMs: 0,
      lastValidAt: 0,
      inputFps: 0,
      inferenceFps: 0,
      lastTimestampMs: 0,
      lastVectorDim: 0,
      validation: '',
      recording: false,
      recordedFrames: 0,
      lastSequenceFrames: 0,
      error: null,
    };
    window.webCameraState = webCameraState;

    // ---------------------------------------------------------------------
    // Escena
    // ---------------------------------------------------------------------
    const lienzo = document.getElementById('lienzo');
    const renderer = new THREE.WebGLRenderer({ canvas: lienzo, alpha: true, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 20);
    // Encuadre de la cintura para arriba: el punto que mira la camara
    // (lookAt) queda a la altura del pecho, y la distancia/FOV estan
    // calculados para que entre desde la cintura hasta la cabeza.
    camera.position.set(0, 1.25, 1.3);
    camera.lookAt(0, 1.22, 0);

    // Camara flotante: un dedo gira alrededor del avatar, dos dedos acercan
    // y desplazan. Imprescindible para revisar una pose de perfil -- de
    // frente es imposible ver si la mano quedo delante o detras del torso,
    // que es justo el error que mas costo encontrar.
    const orbita = new OrbitControls(camera, renderer.domElement);
    orbita.target.set(0, 1.22, 0);
    orbita.enableDamping = true;
    orbita.dampingFactor = 0.1;
    orbita.minDistance = 0.4;
    orbita.maxDistance = 4.0;
    orbita.update();

    const camaraInicial = {
      pos: camera.position.clone(),
      target: orbita.target.clone(),
    };
    function resetCamara() {
      camera.position.copy(camaraInicial.pos);
      orbita.target.copy(camaraInicial.target);
      orbita.update();
    }

    scene.add(new THREE.AmbientLight(0xffffff, 1.1));
    const luzDirigida = new THREE.DirectionalLight(0xffffff, 0.9);
    luzDirigida.position.set(1, 2, 1.5);
    scene.add(luzDirigida);

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // ---------------------------------------------------------------------
    // Carga del VRM
    // ---------------------------------------------------------------------
    let vrm = null;
    let anchoHombrosAvatar = 0.34; // fallback tipico si no se puede medir

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    function onAvatarCargado(gltf) {
      vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      vrm.scene.rotation.y = Math.PI; // three-vrm mira a +Z, la camara esta en -Z
      if (Number.isFinite(cal.avatarScale) && cal.avatarScale > 0) {
        vrm.scene.scale.setScalar(cal.avatarScale);
      }
      scene.add(vrm.scene);

      // Mide el ancho real de hombros del avatar (mundo) para poder
      // convertir las coordenadas normalizadas (shoulder-width = 1) a
      // metros de este modelo en particular.
      const hL = vrm.humanoid.getNormalizedBoneNode(VRMHumanBoneName.LeftUpperArm);
      const hR = vrm.humanoid.getNormalizedBoneNode(VRMHumanBoneName.RightUpperArm);
      if (hL && hR) {
        const pL = new THREE.Vector3(); hL.getWorldPosition(pL);
        const pR = new THREE.Vector3(); hR.getWorldPosition(pR);
        const d = pL.distanceTo(pR);
        if (d > 0.05) anchoHombrosAvatar = d;
      }

      // Postura de reposo: brazos un poco separados del cuerpo para que
      // el 2-bone IK de abajo tenga margen para moverlos sin chocar con
      // el torso.
      // Mide las direcciones de reposo del rig ANTES de posar: el solucionador
      // 3D las usa como referencia y necesita el modelo en T-pose.
      medirRig();
      calibrarSentidoPulgar('left');
      calibrarSentidoPulgar('right');
      posarReposo();
      poblarHuesos();
      window.parlanteVrmListo = true;
    }

    // El modelo NO se pide por fetch/URL: en un WebView cargado con
    // loadFlutterAsset() las rutas relativas a otros assets de Flutter no
    // son confiables (dependen de como cada plataforma arme el dominio
    // virtual del asset loader). En cambio, Dart lee los bytes del .vrm con
    // rootBundle (avatar_bridge.dart) y se los manda a esta funcion ya
    // codificados en base64, apenas la pagina esta lista para recibirlos.
    window.cargarAvatarBase64 = function (b64) {
      try {
        const binario = atob(b64);
        const bytes = new Uint8Array(binario.length);
        for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
        loader.parse(bytes.buffer, '', onAvatarCargado,
          (err) => avisar('No se pudo cargar el avatar: ' + err));
      } catch (e) {
        avisar('No se pudo decodificar el avatar: ' + e);
      }
    };

    // Modo desarrollo web: permite inspeccionar el RigBody sin Flutter ni
    // WebView. Este modo carga el mismo VRM desde el servidor estatico y
    // habilita MediaPipe web al pulsar "Iniciar cámara".
    if (standaloneWeb) {
      fetch('../avatar/univozM.vrm')
        .then((response) => {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.arrayBuffer();
        })
        .then((bytes) => loader.parse(bytes, '', onAvatarCargado,
          (err) => avisar('No se pudo cargar el avatar: ' + err)))
        .catch((err) => avisar('No se pudo descargar el avatar: ' + err));
    }

    // Avisa a Dart que la pagina ya cargo three.js/three-vrm y esta lista
    // para recibir el modelo.
    if (window.SenasChannel) window.SenasChannel.postMessage('js_listo');

    function bone(nombre) {
      return vrm ? vrm.humanoid.getNormalizedBoneNode(nombre) : null;
    }

    // ---------------------------------------------------------------------
    // Calibracion del rig.
    //
    // Todo lo que hubo que ajustar a mano vive aca junto, por brazo. Se toca
    // en vivo desde el panel de calibracion (buscar "PANEL DE CALIBRACION"),
    // idealmente en la pantalla Espejo, donde uno mueve su propio brazo y ve
    // el resultado al instante.
    //
    //   invertZ  Invierte profundidad de worldLandmarks si el modelo/camara
    //            queda con frente y dorso intercambiados.
    //   zInv     Invierte el sentido de rotacion del brazo (arriba/abajo).
    //            Se aplica tambien a la pose de reposo para que no se
    //            contradigan.
    //   dedos    Sentido de flexion de las falanges.
    //   palmaInv Sentido del giro de la muneca.
    //   palmaOff Donde queda el cero del giro de la muneca, en radianes.
    //
    // Deducir estos signos leyendo el codigo no funciono: el rig no se
    // comporta como dice la intuicion sobre los ejes de VRM. Calibrar en el
    // dispositivo es el camino corto.
    // ---------------------------------------------------------------------
    const cal = {
      version: 1,
      avatarScale: 1.0,
      invertZ: false,
      leftArmGain: 1.0,
      rightArmGain: 1.0,
      ikMin: 0.05,
      ikMax: 2.60,
      fingerSensitivity: 1.0,
      wristCompensation: 0.0,
      reposo: 1.40, // cuanto bajan los brazos desde T-pose (comun a los dos)
      // La mano usa un marco ortonormal 3D (dedos, ancho de palma, normal)
      // y un delta de cuaternion respecto al rig medido. No depende de Euler
      // X ni de signos distintos para izquierda/derecha.
      usarMuneca: true,
      // Si una mano desaparece, espera una gracia corta y devuelve sus
      // dedos/muñeca a bind pose. Desactivado conserva comportamiento legacy:
      // última pose válida hasta que mano reaparezca.
      resetHandOnLoss: true,
      // VRM de UNIVOZ: falanges izquierdas parten hacia -X y derechas hacia
      // +X. En ambos lados, +Z lleva la punta hacia arriba; por eso la
      // flexion anatomica hacia abajo usa signos opuestos.
      left:  { zInv: 1, dedos:  1, thumbDedos:  1, palmaInv: 1, palmaOff: 0 },
      right: { zInv: 1, dedos: -1, thumbDedos: -1, palmaInv: 1, palmaOff: 0 },
    };

    // Contrato persistible enviado por Dart. Se acepta string porque
    // webview_flutter cruza JavaScript como texto, pero se valida antes de
    // mutar el rig para no mezclar configuraciones incompatibles.
    window.configurarRig = function (json) {
      try {
        const c = typeof json === 'string' ? JSON.parse(json) : json;
        if (!c || (c.version != null && Number(c.version) !== 1)) return;
        for (const key of ['avatarScale', 'invertZ', 'leftArmGain',
          'rightArmGain', 'ikMin', 'ikMax', 'fingerSensitivity',
          'wristCompensation']) {
          const wire = key.replace(/[A-Z]/g, (m) => '_' + m.toLowerCase());
          if (c[wire] != null) cal[key] = Number(c[wire]);
        }
        if (c.reset_hand_on_loss != null) {
          cal.resetHandOnLoss = c.reset_hand_on_loss !== false;
        }
        if (c.resetHandOnLoss != null) {
          cal.resetHandOnLoss = c.resetHandOnLoss !== false;
        }
        if (c.reposo != null) cal.reposo = Number(c.reposo);
        for (const lado of ['left', 'right']) {
          if (c[lado]) Object.assign(cal[lado], c[lado]);
        }
        if (vrm && Number.isFinite(cal.avatarScale) && cal.avatarScale > 0) {
          vrm.scene.scale.setScalar(cal.avatarScale);
        }
        posarReposo();
      } catch (e) { /* json invalido: se ignora */ }
    };

    // Compatibilidad con editor_pose.html y versiones anteriores del panel.
    window.ajustarCalibracion = window.configurarRig;

    // Que brazos anima el visor. Muchas senas de LSM son de una sola mano;
    // forzar la otra a seguir landmarks que no existen la hace temblar sin
    // sentido. El brazo desactivado se queda en reposo, a un costado.
    // Lo controla Dart via window.configurarManos() (avatar_bridge.dart).
    const manosActivas = { left: true, right: true };

    window.configurarManos = function (izquierda, derecha) {
      manosActivas.left = !!izquierda;
      manosActivas.right = !!derecha;
      if (!manosActivas.left) posarReposoBrazo('left');
      if (!manosActivas.right) posarReposoBrazo('right');
    };

    // Deja UN brazo colgando a un costado. Los signos estan verificados en
    // el dispositivo: ver la nota larga de mas abajo.
    function posarReposoBrazo(lado) {
      const signo = (lado === 'left' ? 1 : -1) * cal[lado].zInv;
      const up = bone(lado === 'left' ? VRMHumanBoneName.LeftUpperArm : VRMHumanBoneName.RightUpperArm);
      const lo = bone(lado === 'left' ? VRMHumanBoneName.LeftLowerArm : VRMHumanBoneName.RightLowerArm);
      if (up) up.rotation.set(0, 0, signo * cal.reposo);
      if (lo) lo.rotation.set(0, 0, 0);
      // Manos abiertas, relajadas y con la palma en bind pose.
      ponerManoReposo(lado);
      ponerMunecaReposo(lado);
    }

    function posarReposo() {
      // Para este rig, rotation 0 en los huesos normalizados es el T-pose
      // (brazos horizontales) -- no la pose de reposo. Hay que rotar cada
      // brazo casi 90 grados desde ahi para que caiga a los costados del
      // cuerpo.
      //
      // Los signos: en VRM el eje +X apunta hacia la izquierda del
      // personaje, pero -- verificado en el dispositivo con este rig -- la
      // rotacion positiva sobre +Z es la que BAJA el brazo izquierdo. El
      // derecho, al apuntar a -X, necesita el signo opuesto. No cambiar
      // estos signos sin volver a probar en el telefono: la primera vez
      // salieron los dos brazos hacia arriba.
      posarReposoBrazo('left');
      posarReposoBrazo('right');
    }

    // ---------------------------------------------------------------------
    // Resolucion de brazos en 3D.
    //
    // sign_norm 2.0.0 entrega cuerpo 3D. Al cargar el modelo se miden sus
    // longitudes y direcciones de reposo; cada frame resuelve posicion de
    // muñeca con IK de dos huesos y conserva plano de flexion capturado.
    // ---------------------------------------------------------------------
    const refRig = { left: null, right: null };
    const refHand = { left: null, right: null };
    const refTorso = {};
    const avDerecha = new THREE.Vector3();
    const avArriba = new THREE.Vector3(0, 1, 0);
    // El avatar mira a +Z: es VRM 0.0 (mira a -Z) y la escena se voltea media
    // vuelta al cargarlo, arriba.
    const avFrente = new THREE.Vector3(0, 0, 1);

    function marcoMano(x, y) {
      const ejeX = x.clone();
      if (ejeX.lengthSq() < 1e-8) return null;
      ejeX.normalize();
      const ejeY = y.clone().addScaledVector(ejeX, -y.dot(ejeX));
      if (ejeY.lengthSq() < 1e-8) return null;
      ejeY.normalize();
      const ejeZ = new THREE.Vector3().crossVectors(ejeX, ejeY);
      if (ejeZ.lengthSq() < 1e-8) return null;
      ejeZ.normalize();
      return { x: ejeX, y: ejeY, z: ejeZ };
    }

    function medirRig() {
      // Hay que medir con TODO en cero: la pose de reposo ya rota los brazos
      // y falsearia las direcciones de referencia.
      for (const n of Object.values(VRMHumanBoneName)) {
        const h = bone(n); if (h) h.rotation.set(0, 0, 0);
      }
      vrm.scene.updateMatrixWorld(true);

      const pL = new THREE.Vector3(), pR = new THREE.Vector3();
      bone(VRMHumanBoneName.LeftUpperArm).getWorldPosition(pL);
      bone(VRMHumanBoneName.RightUpperArm).getWorldPosition(pR);
      avDerecha.subVectors(pR, pL).normalize();

      for (const clave of ['Hips', 'Spine', 'Chest', 'UpperChest',
        'LeftShoulder', 'RightShoulder']) {
        const nombre = VRMHumanBoneName[clave];
        const h = nombre ? bone(nombre) : null;
        refTorso[clave] = h ? {
          bone: h,
          world: h.getWorldQuaternion(new THREE.Quaternion()),
        } : null;
      }

      for (const lado of ['left', 'right']) {
        const up = bone(lado === 'left' ? VRMHumanBoneName.LeftUpperArm : VRMHumanBoneName.RightUpperArm);
        const lo = bone(lado === 'left' ? VRMHumanBoneName.LeftLowerArm : VRMHumanBoneName.RightLowerArm);
        const ma = bone(lado === 'left' ? VRMHumanBoneName.LeftHand : VRMHumanBoneName.RightHand);
        if (!up || !lo || !ma) {
          refRig[lado] = null;
          refHand[lado] = null;
          continue;
        }
        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        up.getWorldPosition(a); lo.getWorldPosition(b); ma.getWorldPosition(c);
        refRig[lado] = {
          dirUp: b.clone().sub(a).normalize(),
          dirLo: c.clone().sub(b).normalize(),
          lenUp: a.distanceTo(b),
          lenLo: b.distanceTo(c),
          qUp: up.getWorldQuaternion(new THREE.Quaternion()),
          qLo: lo.getWorldQuaternion(new THREE.Quaternion()),
          qPadre: up.parent.getWorldQuaternion(new THREE.Quaternion()),
        };

        // Marco anatomico estable del bind pose. El mismo orden se arma con
        // landmarks de MediaPipe, por eso no introduce espejo por lado.
        const prefijo = lado === 'left' ? 'Left' : 'Right';
        const indice = bone(VRMHumanBoneName[`${prefijo}IndexProximal`]);
        const medio = bone(VRMHumanBoneName[`${prefijo}MiddleProximal`]);
        const menique = bone(VRMHumanBoneName[`${prefijo}LittleProximal`]);
        if (!indice || !medio || !menique) {
          refHand[lado] = null;
          continue;
        }
        const pi = new THREE.Vector3(), pm = new THREE.Vector3();
        const pl = new THREE.Vector3();
        indice.getWorldPosition(pi);
        medio.getWorldPosition(pm);
        menique.getWorldPosition(pl);
        const marco = marcoMano(pm.clone().sub(c), pi.clone().sub(pl));
        refHand[lado] = marco ? {
          bone: ma,
          qWorld: ma.getWorldQuaternion(new THREE.Quaternion()),
          marco,
        } : null;
      }
    }

    // El eje Z local no es universal entre avatares VRM. Medir este sentido
    // con el modelo real evita invertir pulgar por asumir que comparte eje
    // con los dedos largos. Solo se prueba en bind pose, antes de recibir
    // cámara; no cambia pose visible ni datos normalizados.
    function calibrarSentidoPulgar(lado) {
      const prefijo = lado === 'left' ? 'Left' : 'Right';
      const metacarpal = bone(VRMHumanBoneName[`${prefijo}ThumbMetacarpal`]);
      const distal = bone(VRMHumanBoneName[`${prefijo}ThumbDistal`]) ||
        bone(VRMHumanBoneName[`${prefijo}ThumbProximal`]);
      if (!metacarpal || !distal) return;
      const antes = new THREE.Vector3();
      const despues = new THREE.Vector3();
      vrm.scene.updateMatrixWorld(true);
      distal.getWorldPosition(antes);
      const rotacionAnterior = metacarpal.rotation.z;
      metacarpal.rotation.z = 0.35;
      vrm.scene.updateMatrixWorld(true);
      distal.getWorldPosition(despues);
      metacarpal.rotation.z = rotacionAnterior;
      vrm.scene.updateMatrixWorld(true);
      const deltaY = despues.y - antes.y;
      if (Number.isFinite(deltaY) && Math.abs(deltaY) > 1e-5) {
        cal[lado].thumbDedos = deltaY < 0 ? 1 : -1;
      }
    }

    // Base del cuerpo. Desde sign_norm 2.0.0 el bloque de cuerpo YA viene
    // proyectado sobre los ejes de la persona: +X a su derecha, +Y arriba,
    // +Z al frente. Asi que no hay nada que deducir, la base es la identidad.
    //
    // No volver a calcularla de los hombros y caderas: daria +Z hacia atras
    // y el avatar senaria en espejo de profundidad.
    const kBase = {
      pDer: new THREE.Vector3(1, 0, 0),
      pArr: new THREE.Vector3(0, 1, 0),
      pFre: new THREE.Vector3(0, 0, 1),
    };
    function baseCuerpo(p) {
      // Solo comprueba que el frame tenga cuerpo utilizable.
      return (Math.abs(p.hombroD.x - p.hombroI.x) > 1e-4) ? kBase : null;
    }

    function vectorBaseAvatar(v, base) {
      const z = cal.invertZ ? -v.dot(base.pFre) : v.dot(base.pFre);
      return new THREE.Vector3()
        .addScaledVector(avDerecha, v.dot(base.pDer))
        .addScaledVector(avArriba, v.dot(base.pArr))
        .addScaledVector(avFrente, z);
    }

    function aBaseAvatar(v, base) {
      return vectorBaseAvatar(v, base).normalize();
    }

    function vectorManoAAvatar(p, base) {
      // p ya pertenece al bloque de FORMA normalizado: sign_norm transforma
      // imagen Y hacia abajo a Y hacia arriba antes de cruzar este puente.
      // Negar Y aqui volvía a invertir dedos y palma verticalmente. MediaPipe
      // mano usa Z negativo hacia la camara, mientras que el avatar usa +Z
      // hacia su frente; corregir esa convencion solo en render.
      const zFrente = cal.invertZ ? p[2] : -p[2];
      return aBaseAvatar(new THREE.Vector3(p[0], p[1], zFrente), base);
    }

    // Utilidades para angulos de falanges, que usan arrays [x,y,z].
    function _largo(v) { return Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]); }
    function _norm(v) { const m = _largo(v) || 1; return [v[0] / m, v[1] / m, v[2] / m]; }
    function _pto(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function _resta(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

    function aplicarTorso(p) {
      const hombros = p.hombroD.clone().sub(p.hombroI);
      const medioHombros = p.hombroD.clone().add(p.hombroI).multiplyScalar(0.5);
      const medioCaderas = p.caderaD.clone().add(p.caderaI).multiplyScalar(0.5);
      const arriba = medioHombros.clone().sub(medioCaderas).normalize();
      const derecha = hombros.normalize();
      if (arriba.lengthSq() < 1e-6 || derecha.lengthSq() < 1e-6) return;
      const frente = new THREE.Vector3().crossVectors(arriba, derecha).normalize();
      if (frente.lengthSq() < 1e-6) return;

      // El vector normalizado conserva inclinacion de pelvis/torso aunque
      // elimina traslacion. Aplicar una base rota huesos sin mover raiz.
      const referencia = new THREE.Matrix4().makeBasis(
        avDerecha, avArriba, avFrente);
      const objetivo = new THREE.Matrix4().makeBasis(derecha, arriba, frente);
      const qReferencia = new THREE.Quaternion().setFromRotationMatrix(referencia);
      const qObjetivo = new THREE.Quaternion().setFromRotationMatrix(objetivo);
      const delta = qObjetivo.multiply(qReferencia.invert());

      const aplicar = (clave, proporcion) => {
        const r = refTorso[clave];
        if (!r) return;
        const parcial = new THREE.Quaternion().slerpQuaternions(
          new THREE.Quaternion(), delta, proporcion);
        const mundo = parcial.multiply(r.world);
        const padre = r.bone.parent.getWorldQuaternion(new THREE.Quaternion());
        r.bone.quaternion.copy(padre.invert().multiply(mundo));
      };

      aplicar('Hips', 1.0);
      aplicar('Spine', 0.75);
      aplicar('Chest', 0.55);
      aplicar('UpperChest', 0.40);
      aplicar('LeftShoulder', 0.30);
      aplicar('RightShoulder', 0.30);
    }

    function resolverBrazo(lado, base, hombro, codo, muneca) {
      const r = refRig[lado];
      if (!r) return;
      const up = bone(lado === 'left' ? VRMHumanBoneName.LeftUpperArm : VRMHumanBoneName.RightUpperArm);
      const lo = bone(lado === 'left' ? VRMHumanBoneName.LeftLowerArm : VRMHumanBoneName.RightLowerArm);

      const hombroAvatar = new THREE.Vector3();
      up.getWorldPosition(hombroAvatar);
      // sign_norm entrega posiciones en anchos de hombro. Se convierten a
      // unidades del avatar para que la mano apunte al mismo punto, no solo
      // en la misma direccion. El gain permite compensar rigs exportados con
      // brazos proporcionalmente distintos.
      const ganancia = lado === 'left' ? cal.leftArmGain : cal.rightArmGain;
      const deltaMano = vectorBaseAvatar(muneca.clone().sub(hombro), base)
        .multiplyScalar(anchoHombrosAvatar * Math.max(0.2, Math.min(2.0, ganancia)));
      const objetivoMuneca = hombroAvatar.clone().add(deltaMano);
      const radioObjetivo = objetivoMuneca.distanceTo(hombroAvatar);
      if (radioObjetivo < 1e-4 || r.lenUp < 1e-4 || r.lenLo < 1e-4) return;

      const limiteMin = Math.max(0, Math.min(Math.PI, cal.ikMin));
      const limiteMax = Math.max(limiteMin, Math.min(Math.PI, cal.ikMax));
      const radioFisicoMin = Math.abs(r.lenUp - r.lenLo) + 1e-5;
      const radioFisicoMax = r.lenUp + r.lenLo - 1e-5;
      // En esta convencion 0 rad es brazo estirado y PI es codo totalmente
      // plegado. La distancia equivalente mantiene límites estables aunque
      // el usuario acerque la mano más de lo que el rig puede alcanzar.
      const radioPorAngulo = (angulo) => Math.sqrt(Math.max(0,
        r.lenUp * r.lenUp + r.lenLo * r.lenLo +
        2 * r.lenUp * r.lenLo * Math.cos(angulo)));
      const radioMin = Math.max(radioFisicoMin, radioPorAngulo(limiteMax));
      const radioMax = Math.min(radioFisicoMax, radioPorAngulo(limiteMin));
      const radio = Math.max(radioMin, Math.min(radioMax, radioObjetivo));
      const direccionObjetivo = objetivoMuneca.clone().sub(hombroAvatar).normalize();
      const objetivoMunecaResuelto = hombroAvatar.clone()
        .addScaledVector(direccionObjetivo, radio);

      // Plano de codo: conserva hacia donde se dobla el brazo capturado,
      // evitando que una solución ambigua salte delante/detrás del torso.
      const codoDeseado = vectorBaseAvatar(codo.clone().sub(hombro), base);
      let planoCodo = codoDeseado.clone()
        .addScaledVector(direccionObjetivo, -codoDeseado.dot(direccionObjetivo));
      if (planoCodo.lengthSq() < 1e-8) {
        planoCodo = r.dirUp.clone()
          .addScaledVector(direccionObjetivo, -r.dirUp.dot(direccionObjetivo));
      }
      if (planoCodo.lengthSq() < 1e-8) planoCodo.copy(avArriba);
      planoCodo.addScaledVector(direccionObjetivo,
        -planoCodo.dot(direccionObjetivo)).normalize();

      const avance = (r.lenUp * r.lenUp - r.lenLo * r.lenLo + radio * radio) /
        (2 * radio);
      const altura = Math.sqrt(Math.max(0, r.lenUp * r.lenUp - avance * avance));
      const elbowTarget = hombroAvatar.clone()
        .addScaledVector(direccionObjetivo, avance)
        .addScaledVector(planoCodo, altura);
      const dirUp = elbowTarget.clone().sub(hombroAvatar).normalize();
      // Upper y lower deben resolver contra mismo punto alcanzable. Usar
      // objetivoMuneca original aquí anulaba límites cuando estaba fuera
      // del alcance: codo se calculaba limitado, antebrazo apuntaba lejos.
      const dirLo = objetivoMunecaResuelto.clone()
        .sub(elbowTarget).normalize();

      const qU = new THREE.Quaternion().setFromUnitVectors(r.dirUp, dirUp);
      const mundoU = qU.clone().multiply(r.qUp);
      const padreActual = up.parent.getWorldQuaternion(new THREE.Quaternion());
      up.quaternion.copy(padreActual.invert().multiply(mundoU));

      // El antebrazo parte de referencia ya girada por el upper arm.
      const partida = r.dirLo.clone().applyQuaternion(qU);
      const qL = new THREE.Quaternion().setFromUnitVectors(partida, dirLo);
      const mundoL = qL.clone().multiply(qU).multiply(r.qLo);
      lo.quaternion.copy(mundoU.clone().invert().multiply(mundoL));
    }

    // Los cuatro dedos largos van Proximal -> Intermediate -> Distal en
    // las dos versiones del spec. El pulgar NO: three-vrm v2 expone los
    // huesos con la nomenclatura de VRM 1.0, donde el pulgar es
    // Metacarpal -> Proximal -> Distal y no existe "ThumbIntermediate".
    // Con la lista generica, ese nombre resolvia a undefined y el
    // metacarpiano -- el hueso que abre y cierra la pinza -- se quedaba
    // quieto. Se detecta en tiempo de carga para no depender de la
    // version exacta de la libreria que sirva el CDN.
    const kFasesGenericas = ['Proximal', 'Intermediate', 'Distal'];
    const kFasesPulgar = VRMHumanBoneName.LeftThumbMetacarpal
      ? ['Metacarpal', 'Proximal', 'Distal']
      : kFasesGenericas;
    const thumbNeutralRig = { left: null, right: null };

    function reiniciarNeutralPulgar() {
      thumbNeutralRig.left = null;
      thumbNeutralRig.right = null;
    }

    // Una sola deteccion perdida no debe resetear mano: oclusion, blur o
    // inferencia lenta producen huecos aislados. Pasado margen, devolver
    // mano a reposo evita dejar dedos congelados en pose imposible.
    const kHandLossGraceMs = 250;
    const estadoPerdidaMano = {
      left: { desde: 0, enReposo: false },
      right: { desde: 0, enReposo: false },
    };

    function reiniciarEstadoPerdidaMano() {
      estadoPerdidaMano.left.desde = 0;
      estadoPerdidaMano.left.enReposo = false;
      estadoPerdidaMano.right.desde = 0;
      estadoPerdidaMano.right.enReposo = false;
    }

    function actualizarEstadoPerdidaMano(lado, presente, ahoraMs) {
      const estado = estadoPerdidaMano[lado];
      if (presente) {
        const reaparecioTrasReposo = estado.enReposo;
        estado.desde = 0;
        estado.enReposo = false;
        if (reaparecioTrasReposo) thumbNeutralRig[lado] = null;
        return true;
      }
      if (!cal.resetHandOnLoss) {
        estado.desde = 0;
        estado.enReposo = false;
        return false;
      }
      if (!estado.desde) estado.desde = ahoraMs;
      if (ahoraMs - estado.desde < kHandLossGraceMs) return false;
      if (!estado.enReposo) {
        ponerManoReposo(lado);
        ponerMunecaReposo(lado);
        estado.enReposo = true;
      }
      return false;
    }

    // Angulo entre dos vectores, en radianes. Siempre positivo: los dedos
    // solo flexionan hacia un lado, asi que la magnitud alcanza y no hay
    // signo que adivinar.
    function _angulo(u, v) {
      const c = _pto(_norm(u), _norm(v));
      return Math.acos(Math.max(-1, Math.min(1, c)));
    }

    function moverMano(lado, presente, puntos) {
      // Si tracking pierde mano, presencia=0 significa conservar ultima
      // posicion valida. Asi no aparece un puño abierto durante un gap breve.
      if (!presente || !puntos) return;
      // puntos: 20 landmarks [x,y,z] relativos a la muneca, ya rotados y
      // escalados por sign_norm.dart.
      //
      // Cada dedo llega con sus cuatro puntos (nudillo, y las tres
      // articulaciones hasta la yema), asi que el angulo de cada falange se
      // mide directo: es el angulo entre un segmento del dedo y el anterior.
      //
      // La version anterior resumia el dedo entero en un solo numero -- la
      // distancia de la yema a la muneca -- y doblaba las tres falanges por
      // igual. Con eso un dedo doblado solo en el nudillo y uno en garra
      // daban la misma pose, y casi cualquier configuracion manual terminaba
      // viendose como un puno a medio cerrar. En LSM la configuracion manual
      // es la mitad del significado, asi que esa aproximacion se comia la
      // seña.
      const dedos = [
        ['Thumb', [0, 1, 2, 3]],
        ['Index', [4, 5, 6, 7]],
        ['Middle', [8, 9, 10, 11]],
        ['Ring', [12, 13, 14, 15]],
        ['Little', [16, 17, 18, 19]],
      ];
      const kFlexMax = 1.6; // tope por falange, para que no se doble de mas

      for (const [nombreDedo, idx] of dedos) {
        const fases = nombreDedo === 'Thumb' ? kFasesPulgar : kFasesGenericas;
        let flex = [0, 0, 0];
        let datosValidos = false;

        if (presente && puntos) {
          const nudillo = puntos[idx[0]];
          const a = puntos[idx[1]];
          const b = puntos[idx[2]];
          const c = puntos[idx[3]];
          // Segmentos: palma->nudillo, y luego cada falange.
          const s0 = nudillo;              // la muneca es el origen
          const s1 = _resta(a, nudillo);
          const s2 = _resta(b, a);
          const s3 = _resta(c, b);
          if (_largo(s1) > 1e-5 && _largo(s2) > 1e-5 && _largo(s3) > 1e-5 &&
              _largo(s0) > 1e-5) {
          // Pulgar MediaPipe: wrist->CMC, CMC->MCP, MCP->IP, IP->punta.
          // VRM de este avatar expone exactamente tres huesos articulados:
          // Metacarpal (CMC), Proximal (MCP) y Distal (IP). Mapear cada
          // angulo a su hueso evita dejar la base rigida y evita duplicar CMC
          // en dos huesos, que producia una flexion artificial.
          const anguloCmc = _angulo(s0, s1);
          const anguloMcp = _angulo(s1, s2);
          const anguloIp = _angulo(s2, s3);
          let angulos = [anguloCmc, anguloMcp, anguloIp];
          if (nombreDedo === 'Thumb' && fases[0] === 'Metacarpal') {
            // Neutral se toma al entrar mano en sesion. Distancia punta a
            // palma decide cierre: giro lateral no activa flexion.
            const distanciaPuntaPalma = _largo(_resta(puntos[3], puntos[8]));
            let neutral = thumbNeutralRig[lado];
            if (!neutral) {
              neutral = thumbNeutralRig[lado] = {
                cmc: anguloCmc, mcp: anguloMcp, ip: anguloIp,
                puntaPalma: distanciaPuntaPalma,
              };
            }
            const cierre = Math.max(0,
              neutral.puntaPalma - distanciaPuntaPalma);
            const cierre01 = Math.min(1, cierre /
              Math.max(0.08, neutral.puntaPalma * 0.55));
            // Si angulo disminuye por perspectiva, cierre conserva señal
            // monotona; solo se permite cuando punta se acerca a palma.
            angulos = [
              Math.max(0, anguloCmc - neutral.cmc, cierre01 * 0.85),
              Math.max(0, anguloMcp - neutral.mcp, cierre01),
              Math.max(0, anguloIp - neutral.ip, cierre01 * 0.75),
            ];
          }
          flex = angulos.map((x) => Math.min(kFlexMax,
            Math.max(0, x * cal.fingerSensitivity)));
          datosValidos = true;
          }
        }

        // Punto degenerado no debe abrir dedo de golpe: conservar ultima
        // rotacion valida hasta que cadena vuelva a ser utilizable.
        if (!datosValidos) continue;

        const signoDedo = nombreDedo === 'Thumb'
          ? (Number(cal[lado].thumbDedos) || cal[lado].dedos)
          : cal[lado].dedos;
        for (let i = 0; i < fases.length; i++) {
          const nombreHueso = VRMHumanBoneName[
            `${lado === 'left' ? 'Left' : 'Right'}${nombreDedo}${fases[i]}`];
          const h = nombreHueso ? bone(nombreHueso) : null;
          if (h) h.rotation.z = signoDedo * flex[i];
        }
      }
    }

    function ponerManoReposo(lado) {
      const dedos = [
        ['Thumb', kFasesPulgar], ['Index', kFasesGenericas],
        ['Middle', kFasesGenericas], ['Ring', kFasesGenericas],
        ['Little', kFasesGenericas],
      ];
      for (const [nombreDedo, fases] of dedos) {
        for (const fase of fases) {
          const nombreHueso = VRMHumanBoneName[
            `${lado === 'left' ? 'Left' : 'Right'}${nombreDedo}${fase}`];
          const h = nombreHueso ? bone(nombreHueso) : null;
          if (h) h.rotation.z = 0;
        }
      }
    }

    // ---------------------------------------------------------------------
    // Orientacion 3D de la palma.
    //
    // Hand landmarks llegan relativos a muneca. Sus tres ejes utiles son:
    // X: muneca -> nudillo medio; Y: indice -> menique; Z: normal de palma.
    // Se construye el mismo marco en bind pose VRM y en cada frame. El delta
    // entre ambos se aplica en mundo y despues se convierte a local; asi la
    // solucion sigue al antebrazo y no depende de Euler X global.
    // ---------------------------------------------------------------------
    const kIdxIndiceMcp = 4, kIdxMedioMcp = 8, kIdxMeniqueMcp = 16;

    function orientarMuneca(lado, presente, puntos, base) {
      const mano = bone(lado === 'left'
        ? VRMHumanBoneName.LeftHand : VRMHumanBoneName.RightHand);
      const referencia = refHand[lado];
      if (!mano || !referencia || !cal.usarMuneca) return;
      // Presencia=0 conserva ultima orientacion valida durante un gap.
      if (!presente || !puntos || !base) return;

      const dedos = vectorManoAAvatar(puntos[kIdxMedioMcp], base);
      const ancho = vectorManoAAvatar([
        puntos[kIdxIndiceMcp][0] - puntos[kIdxMeniqueMcp][0],
        puntos[kIdxIndiceMcp][1] - puntos[kIdxMeniqueMcp][1],
        puntos[kIdxIndiceMcp][2] - puntos[kIdxMeniqueMcp][2],
      ], base);
      const objetivo = marcoMano(dedos, ancho);
      if (!objetivo) return; // landmarks degenerados: conservar ultima pose

      const qRest = new THREE.Quaternion().setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(
          referencia.marco.x, referencia.marco.y, referencia.marco.z));
      const qObjetivo = new THREE.Quaternion().setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(
          objetivo.x, objetivo.y, objetivo.z));
      const delta = qObjetivo.multiply(qRest.invert());
      const ajuste = new THREE.Quaternion().setFromAxisAngle(
        objetivo.x,
        cal[lado].palmaInv * (cal[lado].palmaOff + cal.wristCompensation));
      const mundo = ajuste.multiply(delta).multiply(referencia.qWorld);
      const padre = mano.parent.getWorldQuaternion(new THREE.Quaternion());
      mano.quaternion.copy(padre.invert().multiply(mundo));
    }

    function ponerMunecaReposo(lado) {
      const mano = bone(lado === 'left'
        ? VRMHumanBoneName.LeftHand : VRMHumanBoneName.RightHand);
      if (mano) mano.rotation.set(0, 0, 0);
    }

    function moverExpresionBasica(t) {
      // No hay datos faciales grabados (el pipeline de captura solo mira
      // pose + manos), asi que esto es generico: un parpadeo cada tanto
      // para que no se sienta un maniqui. Nada de esto viene de la seña.
      if (!vrm || !vrm.expressionManager) return;
      const ciclo = (t % 3.6);
      const parpadeo = ciclo > 3.4 ? (1 - (ciclo - 3.4) / 0.2) : (ciclo > 3.3 ? (ciclo - 3.3) / 0.1 : 0);
      vrm.expressionManager.setValue('blink', Math.max(0, Math.min(1, parpadeo)));
    }

    // ---------------------------------------------------------------------
    // Reproduccion de una secuencia de frames (ver dtw.dart / Template.seq)
    // ---------------------------------------------------------------------
    // Layout del vector normalizado, version 2.0.0 (152 dims). Ver
    // lib/sign_norm.dart. El cuerpo son 8 puntos x (x, y, z): hombros,
    // codos, munecas y caderas.
    const kOffBody = 0, kOffLocL = 24, kOffLocR = 27, kOffPresL = 30,
      kOffPresR = 31, kOffShapeL = 32, kOffShapeR = 92,
      kFrameDim = 152, kTFrames = 32;
    // Indices dentro del bloque de cuerpo, en PUNTOS (no en dimensiones).
    const kPtHombroI = 0, kPtHombroD = 1, kPtCodoI = 2, kPtCodoD = 3,
      kPtMunI = 4, kPtMunD = 5, kPtCaderaI = 6, kPtCaderaD = 7;

    // Suaviza solo pose visual. El vector crudo sigue entrando a grabacion y
    // al pipeline IA; asi se reduce jitter sin alterar dataset ni replay.
    const kOneEuroMinCutoffRig = 1.0;
    const kOneEuroBetaRig = 0.01;
    const kOneEuroDCutoffRig = 1.0;
    const kMadWindowRig = 5;
    const kMadThresholdRig = 3.5;
    const kMadMinSigmaRig = 0.005;
    const kRigDeadband = 0.004;
    const kRigMaxRateBody = 5.0;
    const kRigMaxRateHand = 8.0;

    function crearFiltroOneEuro(minCutoff = 1.0, beta = 0.01, dCutoff = 1.0) {
      let inicializado = false;
      let anterior = 0;
      let rawAnterior = 0;
      let velocidadAnterior = 0;
      let tiempoAnterior = 0;
      const alpha = (cutoff, dtMs) => {
        const dt = Math.max(1, dtMs) / 1000;
        const tau = 1 / (2 * Math.PI * Math.max(1e-6, cutoff));
        return 1 / (1 + tau / dt);
      };
      const lowPass = (valor, peso, previo) => peso * valor +
        (1 - peso) * previo;
      return {
        filter(valor, tiempoMs, confianza = 1) {
          const x = Number(valor);
          const t = Number(tiempoMs);
          if (!Number.isFinite(x) || !Number.isFinite(t)) return anterior;
          const c = Math.max(0, Math.min(1, Number(confianza) || 0));
          if (!inicializado) {
            anterior = x;
            rawAnterior = x;
            velocidadAnterior = 0;
            tiempoAnterior = t;
            inicializado = true;
            return x;
          }
          const dtMs = Math.max(1, Math.min(200, t - tiempoAnterior));
          const velocidadRaw = (x - rawAnterior) / (dtMs / 1000);
          const velocidad = lowPass(
            velocidadRaw, alpha(dCutoff, dtMs), velocidadAnterior);
          const cutoff = (minCutoff + beta * Math.abs(velocidad)) *
            (0.5 + 0.5 * c);
          const salida = lowPass(x, alpha(cutoff, dtMs), anterior);
          anterior = salida;
          rawAnterior = x;
          velocidadAnterior = velocidad;
          tiempoAnterior = t;
          return salida;
        },
        reset() {
          inicializado = false;
          anterior = 0;
          rawAnterior = 0;
          velocidadAnterior = 0;
          tiempoAnterior = 0;
        },
      };
    }

    function estadisticaMAD(ventana, valor, umbral = 3.5) {
      const datos = Array.isArray(ventana)
        ? ventana.filter((x) => Number.isFinite(Number(x)))
            .map((x) => Number(x)).sort((a, b) => a - b)
        : [];
      if (!datos.length || !Number.isFinite(Number(valor))) {
        return {median: null, mad: null, sigma: null, z: Infinity, outlier: true};
      }
      const mediana = (xs) => {
        const mitad = Math.floor(xs.length / 2);
        return xs.length % 2 ? xs[mitad] : (xs[mitad - 1] + xs[mitad]) / 2;
      };
      const median = mediana(datos);
      const desviaciones = datos.map((x) => Math.abs(x - median))
        .sort((a, b) => a - b);
      const mad = mediana(desviaciones);
      const sigma = Math.max(1.4826 * mad, kMadMinSigmaRig);
      const z = Math.abs(Number(valor) - median) / sigma;
      return {median, mad, sigma, z, outlier: z > umbral};
    }

    function reiniciarFiltroWeb() {
      filtroFrameWeb = null;
      filtroTimestampWeb = 0;
      filtrosOneEuroWeb = [];
      historialMadWeb = [];
    }

    function rigEsBloqueMano(i) {
      return (i >= kOffLocL && i < kOffLocL + 3) ||
        (i >= kOffShapeL && i < kOffShapeR) ||
        (i >= kOffLocR && i < kOffLocR + 3) ||
        (i >= kOffShapeR && i < kFrameDim);
    }

    function limitarPasoRig(anterior, actual, i, dtMs) {
      if (!Number.isFinite(actual)) return anterior;
      const delta = actual - anterior;
      if (Math.abs(delta) <= kRigDeadband) return anterior;
      const tasa = rigEsBloqueMano(i) ? kRigMaxRateHand : kRigMaxRateBody;
      // Margen corto para movimiento humano; saltos mayores son outliers de
      // tracking, no movimiento real. Mantener ultimo dato evita latigazo.
      const maxPaso = tasa * dtMs / 1000 + 0.02;
      if (Math.abs(delta) > maxPaso * 6) return anterior;
      return anterior + Math.max(-maxPaso, Math.min(maxPaso, delta));
    }

    function suavizarFrameWeb(frame, timestampMs) {
      if (!Array.isArray(frame) || frame.length !== kFrameDim) return null;
      if (!webCameraState.smoothing) {
        reiniciarFiltroWeb();
        return frame.slice();
      }
      const t = Number(timestampMs);
      if (!filtroFrameWeb || !Number.isFinite(t) || t <= filtroTimestampWeb) {
        filtroFrameWeb = frame.slice();
        filtrosOneEuroWeb = Array.from({length: kFrameDim}, () =>
          crearFiltroOneEuro(
            kOneEuroMinCutoffRig, kOneEuroBetaRig, kOneEuroDCutoffRig));
        historialMadWeb = Array.from({length: kFrameDim}, (_, i) =>
          [Number(frame[i])]);
        filtroTimestampWeb = Number.isFinite(t) ? t : 0;
        return filtroFrameWeb.slice();
      }
      const dt = Math.max(1, Math.min(200, t - filtroTimestampWeb));
      const out = filtroFrameWeb.slice();
      const presenteL = Number(frame[kOffPresL]) >= 0.5;
      const presenteR = Number(frame[kOffPresR]) >= 0.5;
      const confianza = typeof frameVivoQuality !== 'undefined' &&
          Number(frameVivoQuality) > 0
        ? Math.max(0, Math.min(1, Number(frameVivoQuality))) : 1;
      for (let i = 0; i < kFrameDim; i++) {
        const esBloqueL = (i >= kOffLocL && i < kOffLocL + 3) ||
          (i >= kOffShapeL && i < kOffShapeR);
        const esBloqueR = (i >= kOffLocR && i < kOffLocR + 3) ||
          (i >= kOffShapeR && i < kFrameDim);
        // Presence es estado discreto, nunca valor interpolado.
        if (i === kOffPresL || i === kOffPresR) {
          out[i] = Number(frame[i]) >= 0.5 ? 1 : 0;
        } else if ((esBloqueL && !presenteL) || (esBloqueR && !presenteR)) {
          out[i] = filtroFrameWeb[i];
        } else {
          const historial = historialMadWeb[i] ?? [];
          historial.push(Number(frame[i]));
          if (historial.length > kMadWindowRig) historial.shift();
          const mad = historial.length >= 4
            ? estadisticaMAD(historial, Number(frame[i]), kMadThresholdRig)
            : {outlier: false};
          const medicion = mad.outlier
            ? filtroFrameWeb[i] : Number(frame[i]);
          // Primera deteccion despues de gap tambien pasa por limitador y
          // One Euro: un punto reaparecido lejos no debe teletransportar rig.
          const objetivo = limitarPasoRig(
            filtroFrameWeb[i], medicion, i, dt);
          out[i] = filtrosOneEuroWeb[i].filter(objetivo, t, confianza);
        }
      }
      filtroFrameWeb = out;
      filtroTimestampWeb = t;
      return out.slice();
    }

    window.suavizarFrameWeb = suavizarFrameWeb;

    let colaFrames = [];
    let frameActual = 0;
    let reproduciendo = false;
    let kFps = 30; // tracking y replay usan 30 FPS; render sigue a 60 FPS.
    let frameVivo = null;
    let frameVivoTimestampMs = 0;
    let frameVivoQuality = 0;
    // Reloj local de recepcion. timestampMs puede venir de DateTime de Dart
    // (epoch) o de performance.now() web; no sirve para medir silencio entre
    // mensajes. Esto cubre tambien stream nativo detenido dentro de WebView.
    let frameVivoRecibidoAt = 0;
    let frameVivoExterno = false;
    let frameVivoStale = false;
    const kFrameStaleMs = 450;
    let filtroFrameWeb = null;
    let filtroTimestampWeb = 0;
    let filtrosOneEuroWeb = [];
    let historialMadWeb = [];

    // ---------------------------------------------------------------------
    // Cámara web + MediaPipe Tasks Vision
    //
    // El navegador procesa video en memoria: no se graba video ni se envia
    // imagen fuera de la pagina. Solo el ultimo vector normalizado llega al
    // mismo RigBody que usa Flutter. detectForVideo es sincrono, asi que esta
    // unica rAF funciona como compuerta natural: tracking cerca de 30 FPS,
    // render siempre a 60 FPS, cero cola creciente.
    // ---------------------------------------------------------------------
    let camaraStream = null;
    let poseLandmarkerWeb = null;
    let handLandmarkerWeb = null;
    let camaraLoopId = 0;
    let camaraUltimoVideoTime = -1;
    let camaraUltimoTimestampMs = 0;
    let camaraFpsInicio = 0;
    let camaraFpsFrames = 0;
    let webGrabacion = [];
    let webUltimaSecuencia = null;

    function webCoord(p) {
      if (Array.isArray(p)) {
        return {
          x: Number(p[0]), y: Number(p[1]), z: Number(p[2]),
          visibility: Number(p[3] ?? 0),
        };
      }
      return {
        x: Number(p?.x), y: Number(p?.y), z: Number(p?.z),
        visibility: Number(p?.visibility ?? 0),
      };
    }

    function webFinito(p) {
      return Number.isFinite(p.x) && Number.isFinite(p.y) &&
        Number.isFinite(p.z);
    }

    function puntoEnCuadroWeb(p) {
      return webFinito(p) && p.x >= 0 && p.x <= 1 &&
        p.y >= 0 && p.y <= 1;
    }

    // No alimentar normalizador con manos parcialmente corruptas. MediaPipe
    // puede devolver un punto aislado fuera de cuadro durante oclusion; si se
    // acepta, ese punto deforma angulo y orientacion de toda mano.
    const kMargenManoWeb = 0.15;
    const kMargenCuerpoWeb = 0.15;
    const kConexionesManoWeb = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17],
    ];

    function webDistancia(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
    }

    function webManoUtilizable(hand) {
      if (!Array.isArray(hand) || hand.length < 21) return false;
      const puntos = hand.map(webCoord);
      if (puntos.some((p) => !webFinito(p))) return false;
      // Wrist must be in view; tips may leave a small margin at frame edge.
      if (!puntoEnCuadroWeb(puntos[0])) return false;
      const dentro = puntos.filter((p) => p.x >= -kMargenManoWeb &&
        p.x <= 1 + kMargenManoWeb && p.y >= -kMargenManoWeb &&
        p.y <= 1 + kMargenManoWeb).length;
      if (dentro < 15) return false;
      const escala = Math.hypot(puntos[9].x - puntos[0].x,
        puntos[9].y - puntos[0].y);
      if (!Number.isFinite(escala) || escala < 0.015 || escala > 0.65) {
        return false;
      }
      // Each connection must stay plausible relative to middle-MCP scale.
      // This catches landmark swaps/spikes while tolerating open/closed hands.
      for (const [a, b] of kConexionesManoWeb) {
        const d = webDistancia(puntos[a], puntos[b]);
        if (!Number.isFinite(d) || d < escala * 0.018 ||
            d > escala * 2.2) return false;
      }
      return true;
    }

    function webPoseGeometriaValida(pose, poseMundo) {
      const falla = (motivo) => {
        if (typeof webCameraState !== 'undefined') {
          webCameraState.validation = motivo;
        }
        return false;
      };
      if (!Array.isArray(pose) || pose.length < 33 ||
          !Array.isArray(poseMundo) || poseMundo.length < 33) {
        return falla('pose-formato');
      }
      const anclas = [11, 12, 23, 24];
      for (const i of anclas) {
        const p = webCoord(pose[i]);
        // Hombros deben estar visibles en imagen; caderas pueden quedar
        // fuera del recorte superior, pero worldLandmarks siguen siendo
        // validos para formar eje vertical del torso.
        const hombroEnMargen = p.x >= -kMargenCuerpoWeb &&
          p.x <= 1 + kMargenCuerpoWeb && p.y >= -kMargenCuerpoWeb &&
          p.y <= 1 + kMargenCuerpoWeb;
        if ((i === 11 || i === 12) &&
            (!webFinito(p) || !hombroEnMargen)) {
          return falla('hombro-fuera');
        }
        const visNecesaria = i === 11 || i === 12;
        if (!webFinito(p) || (visNecesaria &&
            (!Number.isFinite(p.visibility) || p.visibility < 0.2)) ||
            !webFinito(webCoord(poseMundo[i]))) {
          return falla('ancla-insegura-' + i);
        }
      }
      const mundo = poseMundo.map(webCoord);
      const hombros = webDistancia(mundo[11], mundo[12]);
      if (!Number.isFinite(hombros) || hombros < 1e-3) {
        return falla('hombros-degenerados');
      }
      const segmentos = [[11, 13], [13, 15], [12, 14], [14, 16], [23, 24]];
      for (const [a, b] of segmentos) {
        const d = webDistancia(mundo[a], mundo[b]);
        if (!Number.isFinite(d) || d < hombros * 0.08 ||
            d > hombros * 2.5) return falla('segmento-invalido-' + a + '-' + b);
      }
      const centroHombros = {
        x: (mundo[11].x + mundo[12].x) * 0.5,
        y: (mundo[11].y + mundo[12].y) * 0.5,
        z: (mundo[11].z + mundo[12].z) * 0.5,
      };
      const centroCaderas = {
        x: (mundo[23].x + mundo[24].x) * 0.5,
        y: (mundo[23].y + mundo[24].y) * 0.5,
        z: (mundo[23].z + mundo[24].z) * 0.5,
      };
      const tronco = webDistancia(centroHombros, centroCaderas);
      if (!Number.isFinite(tronco) || tronco <= hombros * 0.25 ||
          tronco >= hombros * 4.0) return falla('tronco-invalido');
      return true;
    }

    function webResta(a, b) {
      return [a.x - b.x, a.y - b.y, a.z - b.z];
    }

    function webPuntoResta(a, b) {
      return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    }

    function webLargo(a) {
      return Math.hypot(a[0], a[1], a[2]);
    }

    function webUnitario(a) {
      const m = webLargo(a);
      return m < 1e-6 ? null : [a[0] / m, a[1] / m, a[2] / m];
    }

    function webPto(a, b) {
      return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    function webCruz(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0],
      ];
    }

    function webBaseCuerpo(world) {
      const hombroI = webCoord(world[11]);
      const hombroD = webCoord(world[12]);
      const caderaI = webCoord(world[23]);
      const caderaD = webCoord(world[24]);
      if (!webFinito(hombroI) || !webFinito(hombroD) ||
          !webFinito(caderaI) || !webFinito(caderaD)) {
        return null;
      }
      const escala = webLargo(webResta(hombroD, hombroI));
      if (!Number.isFinite(escala) || escala < 1e-6) return null;

      const derecha = webUnitario(webResta(hombroD, hombroI));
      if (!derecha) return null;
      const origen = [
        (hombroI.x + hombroD.x) * 0.5,
        (hombroI.y + hombroD.y) * 0.5,
        (hombroI.z + hombroD.z) * 0.5,
      ];
      const centroCaderas = [
        (caderaI.x + caderaD.x) * 0.5,
        (caderaI.y + caderaD.y) * 0.5,
        (caderaI.z + caderaD.z) * 0.5,
      ];
      const tronco = webPuntoResta(
        origen, centroCaderas);
      const arriba = webUnitario([
        tronco[0] - derecha[0] * webPto(tronco, derecha),
        tronco[1] - derecha[1] * webPto(tronco, derecha),
        tronco[2] - derecha[2] * webPto(tronco, derecha),
      ]);
      if (!arriba) return null;
      const frente = webUnitario(webCruz(arriba, derecha));
      if (!frente) return null;
      return { derecha, arriba, frente, origen, escala };
    }

    function webProyectar(base, punto) {
      const p = webCoord(punto);
      if (!webFinito(p)) return null;
      const q = [
        p.x - base.origen[0],
        p.y - base.origen[1],
        p.z - base.origen[2],
      ];
      return [
        webPto(q, base.derecha) / base.escala,
        webPto(q, base.arriba) / base.escala,
        webPto(q, base.frente) / base.escala,
      ];
    }

    /**
     * Espejo JS de normalizeFrame() en sign_norm.dart/sign_norm.py.
     * Entrada: resultados crudos de PoseLandmarker y HandLandmarker.
     * Salida: vector MotionFrameV2, exactamente 152 valores o null.
     */
    function normalizarFrameWeb(pose, poseMundo, left, right) {
      webCameraState.validation = '';
      if (!Array.isArray(pose) || pose.length < 33 ||
          !Array.isArray(poseMundo) || poseMundo.length < 33) return null;
      const ls = webCoord(pose[11]);
      const rs = webCoord(pose[12]);
      if (!webFinito(ls) || !webFinito(rs) ||
          ls.visibility < 0.5 || rs.visibility < 0.5) return null;

      const bodyIdx = [11, 12, 13, 14, 15, 16, 23, 24];
      if (bodyIdx.some((i) => !webFinito(webCoord(poseMundo[i])))) {
        return null;
      }
      if (!webPoseGeometriaValida(pose, poseMundo)) {
        if (!webCameraState.validation) webCameraState.validation = 'pose-geometria';
        return null;
      }
      const base = webBaseCuerpo(poseMundo);
      if (!base) return null;

      const dx = rs.x - ls.x;
      const dy = rs.y - ls.y;
      const escalaImg = Math.hypot(dx, dy);
      if (escalaImg < 1e-6) return null;
      const cosT = dx / escalaImg;
      const sinT = dy / escalaImg;
      const out = Array(152).fill(0);

      for (let i = 0; i < bodyIdx.length; i++) {
        const q = webProyectar(base, poseMundo[bodyIdx[i]]);
        if (!q) return null;
        out[i * 3] = q[0];
        out[i * 3 + 1] = q[1];
        out[i * 3 + 2] = q[2];
      }

      const manos = [
        [left, 24, 30, 32, 15],
        [right, 27, 31, 92, 16],
      ];
      for (const [rawHand, offLoc, offPres, offShape, poseWrist] of manos) {
        if (!Array.isArray(rawHand) || rawHand.length < 21) continue;
        const hand = rawHand.map(webCoord);
        if (!webManoUtilizable(hand)) {
          webCameraState.validation = 'mano-geometria';
          continue;
        }
        const q = webProyectar(base, poseMundo[poseWrist]);
        if (!q) continue;
        out[offLoc] = q[0];
        out[offLoc + 1] = q[1];
        out[offLoc + 2] = q[2];
        out[offPres] = 1;

        const w = hand[0];
        const m = hand[9];
        let escalaMano = Math.hypot(m.x - w.x, m.y - w.y);
        if (escalaMano < 1e-6) escalaMano = escalaImg * 0.25;
        for (let j = 1; j < 21; j++) {
          const p = hand[j];
          const qx = p.x - w.x;
          const qy = p.y - w.y;
          const k = offShape + (j - 1) * 3;
          out[k] = (qx * cosT + qy * sinT) / escalaMano;
          out[k + 1] = (-qx * sinT + qy * cosT) / escalaMano;
          out[k + 2] = (p.z - w.z) / escalaMano;
        }
      }
      return out.every(Number.isFinite) ? out : null;
    }

    window.normalizarFrameWeb = normalizarFrameWeb;

    function pintarOverlayWeb(pose, left, right) {
      const video = document.getElementById('camaraVideo');
      const canvas = document.getElementById('camaraOverlay');
      if (!video || !canvas || !video.videoWidth || !video.videoHeight) return;
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = Math.max(2, canvas.width / 320);
      ctx.strokeStyle = '#44e37a';
      ctx.fillStyle = '#44e37a';
      const pxy = (p) => {
        const q = webCoord(p);
        return puntoEnCuadroWeb(q)
          ? [q.x * canvas.width, q.y * canvas.height] : null;
      };
      const line = (a, b, color) => {
        const pa = pxy(a), pb = pxy(b);
        if (!pa || !pb) return;
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(pa[0], pa[1]);
        ctx.lineTo(pb[0], pb[1]);
        ctx.stroke();
      };
      const dot = (p, color) => {
        const q = pxy(p);
        if (!q) return;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(q[0], q[1], Math.max(2, canvas.width / 160), 0, Math.PI * 2);
        ctx.fill();
      };
      const poseEdges = [
        [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
        [11, 23], [12, 24], [23, 24],
      ];
      for (const [a, b] of poseEdges) line(pose?.[a], pose?.[b], '#44e37a');
      for (const [hand, etiqueta, color] of [
        [left, 'I', '#ff9f43'], [right, 'D', '#62b7ff'],
      ]) {
        if (!hand) continue;
        const handEdges = [
          [0, 1], [1, 2], [2, 3], [3, 4],
          [0, 5], [5, 6], [6, 7], [7, 8],
          [0, 9], [9, 10], [10, 11], [11, 12],
          [0, 13], [13, 14], [14, 15], [15, 16],
          [0, 17], [17, 18], [18, 19], [19, 20],
          [5, 9], [9, 13], [13, 17],
        ];
        for (const [a, b] of handEdges) line(hand[a], hand[b], color);
        for (const p of hand) dot(p, color);
        const muñeca = pxy(hand[0]);
        if (muñeca) {
          ctx.fillStyle = color;
          ctx.font = `bold ${Math.max(12, canvas.width / 24)}px sans-serif`;
          ctx.fillText(etiqueta, muñeca[0] + 6, muñeca[1] - 6);
        }
      }
      if (pose) {
        for (const p of pose) dot(p, '#44e37a');
      }
    }

    function pintarEstadoCamaraWeb() {
      const estado = document.getElementById('camaraEstado');
      const stats = document.getElementById('camaraStats');
      const iniciar = document.getElementById('bIniciarCamara');
      const detener = document.getElementById('bDetenerCamara');
      const grabar = document.getElementById('bGrabarCamara');
      const repetir = document.getElementById('bRepetirCamara');
      const descargar = document.getElementById('bDescargarCamara');
      if (!estado || !stats || !iniciar || !detener ||
          !grabar || !repetir || !descargar) return;
      const s = webCameraState;
      estado.className = 'camaraEstado' + (s.error ? ' error' : s.running ? ' ok' : '');
      estado.textContent = s.loading ? 'Cargando…' : s.error ? 'Error' :
        s.running ? 'Activa' : 'Apagada';
      iniciar.disabled = s.loading || s.running;
      detener.disabled = !s.running && !s.loading;
      grabar.disabled = !s.running || s.recording;
      repetir.disabled = !webUltimaSecuencia;
      descargar.disabled = !webUltimaSecuencia;
      const calidad = s.quality > 0 ? Math.round(s.quality * 100) + '%' : '—';
      stats.textContent = 'Pose: ' + (s.pose ? 'sí' : 'no') +
        ' · I: ' + (s.leftHand ? 'sí' : 'no') +
        ' · D: ' + (s.rightHand ? 'sí' : 'no') +
        ' · Vector: ' + (s.lastVectorDim || '—') +
        ' · Q: ' + calidad + ' · ' + s.inferenceFps + ' FPS · válidos ' + s.validFrames +
        (s.recording ? ' · grabando ' + s.recordedFrames + '/32' :
          s.lastSequenceFrames ? ' · secuencia lista' : '') +
        (s.stale ? ' · sin tracking' : '') +
        (s.validation ? ' · ' + s.validation : '');
    }

    function siguienteTimestampWeb() {
      // MediaPipe Tasks Web espera reloj monotónico en milisegundos. Usar
      // epoch (~1e12) desborda timestamp interno y detiene CalculatorGraph.
      const ahora = Math.round(performance.now());
      camaraUltimoTimestampMs = Math.max(ahora, camaraUltimoTimestampMs + 1);
      return camaraUltimoTimestampMs;
    }

    function ladoPorMunecaPoseWeb(mano, pose) {
      const wrist = webCoord(mano?.[0]);
      const leftWrist = webCoord(pose?.[15]);
      const rightWrist = webCoord(pose?.[16]);
      const leftShoulder = webCoord(pose?.[11]);
      const rightShoulder = webCoord(pose?.[12]);
      if (!webFinito(wrist) || !webFinito(leftWrist) ||
          !webFinito(rightWrist) || !webFinito(leftShoulder) ||
          !webFinito(rightShoulder) ||
          !poseMunecaConfiableWeb(leftWrist) ||
          !poseMunecaConfiableWeb(rightWrist)) return null;

      const leftDistance = Math.hypot(
        wrist.x - leftWrist.x, wrist.y - leftWrist.y);
      const rightDistance = Math.hypot(
        wrist.x - rightWrist.x, wrist.y - rightWrist.y);
      const shoulderWidth = Math.hypot(
        rightShoulder.x - leftShoulder.x,
        rightShoulder.y - leftShoulder.y);
      // Pose wrist can jitter several pixels. When both candidates are too
      // close, return null and let label/x fallback decide without a jump.
      const margin = Math.max(0.035, shoulderWidth * 0.12);
      if (Math.abs(leftDistance - rightDistance) < margin) return null;
      return leftDistance < rightDistance ? 'left' : 'right';
    }

    function poseMunecaConfiableWeb(punto) {
      return webFinito(punto) && Number.isFinite(punto.visibility) &&
        punto.visibility >= 0.35;
    }

    function ladoFisicoManoWeb(mano, etiqueta, pose) {
      // Pose landmarks carry anatomical left/right and share image with hand
      // landmarks. They resolve crossed hands better than x<centre and also
      // detect a contradictory handedness category before it flips avatar.
      const ladoPose = ladoPorMunecaPoseWeb(mano, pose);
      if (ladoPose) return ladoPose;

      const raw = String(etiqueta ?? '').toLowerCase();
      // Entrada cruda no espejada: MediaPipe entrega Left/Right suponiendo
      // selfie espejada, asi que etiqueta conocida se invierte. Solo llega
      // aqui cuando pose no pudo resolver lado por distancia confiable.
      if (raw.includes('left')) return 'right';
      if (raw.includes('right')) return 'left';

      // Respaldo sin etiqueta: en imagen cruda, mano fisica izquierda queda
      // a la derecha del centro de hombros. Margen evita decidir con mano
      // cruzada justo frente al esternon.
      const muñeca = webCoord(mano?.[0]);
      const ls = webCoord(pose?.[11]);
      const rs = webCoord(pose?.[12]);
      const centroHombros = (Number.isFinite(ls.x) && Number.isFinite(rs.x))
        ? (ls.x + rs.x) * 0.5 : NaN;
      if (!webFinito(muñeca) || !Number.isFinite(centroHombros)) return null;
      if (muñeca.x > centroHombros + 0.02) return 'left';
      if (muñeca.x < centroHombros - 0.02) return 'right';
      return null;
    }

    const kManoTrackGapMs = 500;
    const ultimaAsignacionWeb = {
      left: null, right: null, timestampMs: 0,
    };

    function manosDesdeResultado(resultado, pose, timestampMs = 0) {
      let left = null;
      let right = null;
      const manos = resultado?.landmarks ?? [];
      const etiquetas = resultado?.handednesses ?? resultado?.handedness ?? [];
      const t = Number(timestampMs);
      const registrar = (izquierda, derecha) => {
        if (Number.isFinite(t) && t > 0) {
          ultimaAsignacionWeb.left = izquierda ? webCoord(izquierda[0]) : null;
          ultimaAsignacionWeb.right = derecha ? webCoord(derecha[0]) : null;
          ultimaAsignacionWeb.timestampMs = t;
        }
        return { left: izquierda, right: derecha };
      };

      // Resolver las dos manos como asignacion global. Decidir cada mano por
      // separado falla cuando una cruza el centro: ambas pueden quedar mas
      // cerca de la misma muñeca de pose y una termina descartada.
      const poseLeft = webCoord(pose?.[15]);
      const poseRight = webCoord(pose?.[16]);
      const poseUsable = poseMunecaConfiableWeb(poseLeft) &&
        poseMunecaConfiableWeb(poseRight);
      const distanciaPose = (mano, objetivo) => {
        const wrist = webCoord(mano?.[0]);
        return webFinito(wrist) && webFinito(objetivo)
          ? Math.hypot(wrist.x - objetivo.x, wrist.y - objetivo.y)
          : Infinity;
      };
      if (poseUsable && manos.length >= 2) {
        const a = manos[0], b = manos[1];
        const normal = distanciaPose(a, poseLeft) + distanciaPose(b, poseRight);
        const cruzada = distanciaPose(a, poseRight) + distanciaPose(b, poseLeft);
        if (Number.isFinite(normal) && Number.isFinite(cruzada)) {
          const margen = Math.max(0.035, Math.hypot(
            poseLeft.x - poseRight.x, poseLeft.y - poseRight.y) * 0.12);
          const trackVigente = Number.isFinite(t) && t > 0 &&
            t - ultimaAsignacionWeb.timestampMs <= kManoTrackGapMs &&
            ultimaAsignacionWeb.left && ultimaAsignacionWeb.right;
          if (Math.abs(normal - cruzada) > margen || !trackVigente) {
            if (normal <= cruzada) {
              left = a; right = b;
            } else {
              left = b; right = a;
            }
          } else {
            const wa = webCoord(a[0]), wb = webCoord(b[0]);
            const continuidadNormal = Math.hypot(
              wa.x - ultimaAsignacionWeb.left.x,
              wa.y - ultimaAsignacionWeb.left.y) + Math.hypot(
              wb.x - ultimaAsignacionWeb.right.x,
              wb.y - ultimaAsignacionWeb.right.y);
            const continuidadCruzada = Math.hypot(
              wb.x - ultimaAsignacionWeb.left.x,
              wb.y - ultimaAsignacionWeb.left.y) + Math.hypot(
              wa.x - ultimaAsignacionWeb.right.x,
              wa.y - ultimaAsignacionWeb.right.y);
            if (continuidadNormal <= continuidadCruzada) {
              left = a; right = b;
            } else {
              left = b; right = a;
            }
          }
          return registrar(left, right);
        }
      }

      const candidatos = [];
      for (let i = 0; i < manos.length; i++) {
        const etiqueta = String(etiquetas?.[i]?.[0]?.categoryName ?? '').toLowerCase();
        const lado = ladoFisicoManoWeb(manos[i], etiqueta, pose);
        if (lado) candidatos.push({ lado, mano: manos[i], explicita:
          etiqueta.includes('left') || etiqueta.includes('right') });
      }
      // Etiquetas conocidas ganan frente al respaldo geometrico.
      candidatos.sort((a, b) => Number(b.explicita) - Number(a.explicita));
      for (const candidato of candidatos) {
        if (candidato.lado === 'left' && !left) left = candidato.mano;
        if (candidato.lado === 'right' && !right) right = candidato.mano;
      }
      return registrar(left, right);
    }

    function calcularCalidadFrameWeb(pose, poseMundo, left, right) {
      if (!Array.isArray(pose) || pose.length < 33 ||
          !Array.isArray(poseMundo) || poseMundo.length < 33) return 0;
      const cuerpo = [11, 12, 13, 14, 15, 16, 23, 24]
        .map((i) => webCoord(pose[i]).visibility);
      if (cuerpo.some((v) => !Number.isFinite(v))) return 0;
      // El mínimo es demasiado sensible: un codo parcialmente tapado hunde
      // Q aunque hombros y caderas sigan siendo utilizables. Promedio evita
      // ese falso cero y mantiene rango [0,1].
      const visibilidad = Math.max(0, Math.min(1,
        cuerpo.reduce((total, valor) => total + Math.max(0, Math.min(1, valor)), 0)
          / cuerpo.length));
      // Una mano basta para una seña valida. Dos manos suben calidad, pero
      // perder una no degrada frame completo a cero.
      const manos = left && right ? 1 : left || right ? 0.82 : 0.65;
      return Math.max(0, Math.min(1, visibilidad * 0.75 + manos * 0.25));
    }

    function procesarCamaraWeb() {
      if (!webCameraState.running) return;
      const video = document.getElementById('camaraVideo');
      if (video && video.readyState >= 2 &&
          video.currentTime !== camaraUltimoVideoTime &&
          !webCameraState.processing) {
        camaraUltimoVideoTime = video.currentTime;
        webCameraState.processing = true;
        const timestampMs = siguienteTimestampWeb();
        try {
          const poseResult = poseLandmarkerWeb.detectForVideo(video, timestampMs);
          const handResult = handLandmarkerWeb.detectForVideo(video, timestampMs);
          const pose = poseResult?.landmarks?.[0] ?? null;
          const poseMundo = poseResult?.worldLandmarks?.[0] ?? null;
          const manos = manosDesdeResultado(handResult, pose, timestampMs);
          const vector = normalizarFrameWeb(
            pose, poseMundo, manos.left, manos.right);
          webCameraState.frames++;
          webCameraState.pose = !!pose && !!poseMundo;
          webCameraState.leftHand = !!manos.left;
          webCameraState.rightHand = !!manos.right;
          webCameraState.lastTimestampMs = timestampMs;
          webCameraState.lastVectorDim = vector?.length ?? 0;
          if (vector) {
            const ahoraValido = performance.now();
            const calidad = calcularCalidadFrameWeb(
              pose, poseMundo, manos.left, manos.right);
            webCameraState.validFrames++;
            webCameraState.quality = calidad;
            webCameraState.lastValidAt = ahoraValido;
            webCameraState.stale = false;
            webCameraState.staleMs = 0;
            frameVivo = suavizarFrameWeb(vector, timestampMs);
            frameVivoTimestampMs = timestampMs;
            frameVivoQuality = calidad;
            if (webCameraState.recording) {
              webGrabacion.push(vector.slice());
              webCameraState.recordedFrames = webGrabacion.length;
              if (webGrabacion.length >= kTFrames) {
                webUltimaSecuencia = webGrabacion.slice(0, kTFrames);
                webCameraState.recording = false;
                webCameraState.lastSequenceFrames = kTFrames;
                pintarEstadoCamaraWeb();
              }
            }
          } else {
            webCameraState.invalidFrames++;
            webCameraState.staleMs = webCameraState.lastValidAt
              ? Math.max(0, performance.now() - webCameraState.lastValidAt) : 0;
