    let ultimoSourceFrameRenderizado = 0;
    let frameVivoSourceSkewMs = 0;
    // Reloj local de recepcion. timestampMs puede venir de DateTime de Dart
    // (epoch) o de performance.now() web; no sirve para medir silencio entre
    // mensajes. Esto cubre tambien stream nativo detenido dentro de WebView.
    let frameVivoRecibidoAt = 0;
    let frameVivoExterno = false;
    let frameVivoStale = false;
    const kFrameStaleMs = 450;
    let filtroFrameWeb = null;
    let filtroTimestampWeb = 0;

    const kThumbCalibrationSteps = [
      {side: 'left', pose: 'open', text: 'Abre mano izquierda y extiende pulgar'},
      {side: 'left', pose: 'closed', text: 'Lleva pulgar izquierdo hacia palma'},
      {side: 'right', pose: 'open', text: 'Abre mano derecha y extiende pulgar'},
      {side: 'right', pose: 'closed', text: 'Lleva pulgar derecho hacia palma'},
    ];
    let thumbCalibrationSession = null;

    function medianValue(values) {
      const sorted = values.slice().sort((a, b) => a - b);
      const middle = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[middle] :
        (sorted[middle - 1] + sorted[middle]) / 2;
    }

    function thumbPointsFromFrame(frame, side) {
      const presence = side === 'left' ? kOffPresL : kOffPresR;
      const offset = side === 'left' ? kOffShapeL : kOffShapeR;
      if (!Array.isArray(frame) || Number(frame[presence]) < .5) return null;
      return Array.from({length: 20}, (_, index) => [
        Number(frame[offset + index * 3]),
        Number(frame[offset + index * 3 + 1]),
        Number(frame[offset + index * 3 + 2]),
      ]);
    }

    function pintarPasoCalibracion(message = null) {
      const element = document.getElementById('diagCalibracion');
      if (!element) return;
      if (!thumbCalibrationSession) {
        element.textContent = message ?? 'Calibración inactiva';
        return;
      }
      const step = kThumbCalibrationSteps[thumbCalibrationSession.step];
      element.textContent = message ??
        `Paso ${thumbCalibrationSession.step + 1}/4: ${step.text}. ` +
        `${thumbCalibrationSession.samples.length}/20 estables`;
    }

    window.iniciarCalibracionPulgares = function () {
      window.configurarDiagnostico(true);
      thumbCalibrationSession = {step: 0, samples: [], measurements: {}};
      pintarPasoCalibracion();
      return true;
    };

    function resumenCalibracion(samples) {
      const distanceValues = samples.map((sample) => sample.distance);
      const angleValues = [0, 1, 2].map((index) =>
        samples.map((sample) => sample.angles[index]));
      const spreadDistance = Math.max(...distanceValues) - Math.min(...distanceValues);
      const spreadAngles = angleValues.map((values) =>
        Math.max(...values) - Math.min(...values));
      if (spreadDistance > .05 || spreadAngles.some((spread) => spread > .15)) {
        return null;
      }
      return {
        distance: medianValue(distanceValues),
        angles: angleValues.map(medianValue),
      };
    }

    function procesarCalibracionPulgares(frame, quality) {
      if (!thumbCalibrationSession) return;
      const step = kThumbCalibrationSteps[thumbCalibrationSession.step];
      const points = thumbPointsFromFrame(frame, step.side);
      if (!points || Number(quality) < .65) {
        thumbCalibrationSession.samples = [];
        pintarPasoCalibracion(`Paso ${thumbCalibrationSession.step + 1}/4: ` +
          `${step.text}. Tracking bajo; mantén pose y mano completa.`);
        return;
      }
      const measurement = measureThumbPose(points);
      if (!measurement) {
        thumbCalibrationSession.samples = [];
        pintarPasoCalibracion('Geometría de pulgar inválida; muestra mano completa.');
        return;
      }
      thumbCalibrationSession.samples.push(measurement);
      if (thumbCalibrationSession.samples.length < 20) {
        pintarPasoCalibracion();
        return;
      }
      const summary = resumenCalibracion(thumbCalibrationSession.samples);
      if (!summary) {
        thumbCalibrationSession.samples = [];
        pintarPasoCalibracion('Movimiento detectado. Repite pose y mantenla estable.');
        return;
      }
      thumbCalibrationSession.measurements[`${step.side}_${step.pose}`] = summary;
      thumbCalibrationSession.step++;
      thumbCalibrationSession.samples = [];
      if (thumbCalibrationSession.step < kThumbCalibrationSteps.length) {
        pintarPasoCalibracion();
        return;
      }
      try {
        const measurements = thumbCalibrationSession.measurements;
        cal.thumbCalibration.left = createThumbCalibration(
          measurements.left_open, measurements.left_closed, Date.now());
        cal.thumbCalibration.right = createThumbCalibration(
          measurements.right_open, measurements.right_closed, Date.now());
        const wire = thumbCalibrationWire();
        if (standaloneWeb) {
          localStorage.setItem('univoz.thumbCalibration.v2', JSON.stringify(wire));
        } else if (window.SenasChannel) {
          window.SenasChannel.postMessage('thumb_calibration:' + JSON.stringify(wire));
        }
        thumbCalibrationSession = null;
        pintarPasoCalibracion('Calibración guardada para ambas manos.');
      } catch (error) {
        thumbCalibrationSession = null;
        errorDiagnostico('calibration', 'thumb_poses_not_distinct');
        pintarPasoCalibracion('Poses demasiado parecidas. Reinicia calibración.');
      }
    }

    // ---------------------------------------------------------------------
    // Cámara web + MediaPipe Tasks Vision
    //
    // El navegador procesa video en memoria: no se graba video ni se envia
    // imagen fuera de la pagina. Solo el ultimo vector normalizado llega al
    // mismo RigBody que usa Flutter. detectForVideo es sincrono, asi que esta
    // unica rAF funciona como compuerta natural: tracking cerca de 30 FPS,
    // render siempre a 60 FPS, cero cola creciente.
    // ---------------------------------------------------------------------
    let camaraStream = null;
    let poseLandmarkerWeb = null;
    let handLandmarkerWeb = null;
    let preloadedLandmarkersWeb = null;
    let detectorWarmupWeb = null;
    let camaraLoopId = 0;
    let camaraUltimoVideoTime = -1;
    let camaraUltimoTimestampMs = 0;
    let camaraFpsInicio = 0;
    let camaraFpsFrames = 0;
    let camaraInputQualityInicio = 0;
    let camaraInputQualityFrames = 0;
    let camaraInputQualityDropped = 0;
    const camaraTimings = {pose: [], hand: [], process: [], render: []};
    let renderFpsInicio = 0;
    let renderFpsFrames = 0;
    let camaraTrackingFpsFrames = 0;
    let camaraPoseFpsFrames = 0;
    let webCaptureFrameIndex = 0;
    let webPoseCache = null;
    let webGrabacion = [];
    let webUltimaSecuencia = null;

    function percentilWeb(values, percentile = .95) {
      if (!values.length) return 0;
      const sorted = values.slice().sort((a, b) => a - b);
      const index = Math.min(sorted.length - 1,
        Math.ceil((sorted.length - 1) * percentile));
      return sorted[index];
    }

    function registrarTiempoWeb(stage, elapsedMs) {
      const value = Math.max(0, Number(elapsedMs) || 0);
      const samples = camaraTimings[stage];
      samples.push(value);
      if (samples.length > 60) samples.shift();
      const current = `${stage}Ms`;
      const p95 = `${stage}P95Ms`;
      webCameraState[current] = value;
      webCameraState[p95] = percentilWeb(samples);
      webPerformanceMetrics.recordStage(stage, value);
      actualizarMetricasWeb();
    }

    function actualizarMetricasWeb() {
      const report = webPerformanceMetrics.snapshot();
      for (const stage of ['pose', 'hand', 'process']) {
        const summary = report.stages[stage];
        if (!summary) continue;
        webCameraState[`${stage}P50Ms`] = summary.p50_ms;
        webCameraState[`${stage}P95Ms`] = summary.p95_ms;
        webCameraState[`${stage}P99Ms`] = summary.p99_ms;
      }
      webCameraState.latencyP50Ms = report.latency_ms.p50_ms;
      webCameraState.latencyP95Ms = report.latency_ms.p95_ms;
      webCameraState.latencyP99Ms = report.latency_ms.p99_ms;
      webCameraState.metricsFrames = report.frames.total;
    }

    function reiniciarTiemposWeb() {
      for (const samples of Object.values(camaraTimings)) samples.length = 0;
      for (const key of [
        'poseMs', 'handMs', 'processMs',
        'poseP50Ms', 'poseP95Ms', 'poseP99Ms',
        'handP50Ms', 'handP95Ms', 'handP99Ms',
        'processP50Ms', 'processP95Ms', 'processP99Ms',
      ]) webCameraState[key] = 0;
      webCameraState.framesSkipped = 0;
    }

    function webCoord(p) {
      if (Array.isArray(p)) {
        return {
          x: Number(p[0]), y: Number(p[1]), z: Number(p[2]),
          visibility: Number(p[3] ?? 0),
        };
      }
      return {
        x: Number(p?.x), y: Number(p?.y), z: Number(p?.z),
        visibility: Number(p?.visibility ?? 0),
      };
    }

    function webFinito(p) {
      return Number.isFinite(p.x) && Number.isFinite(p.y) &&
        Number.isFinite(p.z);
    }

    function puntoEnCuadroWeb(p) {
      return webFinito(p) && p.x >= 0 && p.x <= 1 &&
        p.y >= 0 && p.y <= 1;
    }

    // No alimentar normalizador con manos parcialmente corruptas. MediaPipe
    // puede devolver un punto aislado fuera de cuadro durante oclusion; si se
    // acepta, ese punto deforma angulo y orientacion de toda mano.
    const kMargenManoWeb = 0.15;
    const kMargenCuerpoWeb = 0.15;
    const kConexionesManoWeb = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17],
    ];

    function webDistancia(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
    }

    function webManoUtilizable(hand, side = null) {
      const fail = (code, landmark = null) => {
        if (typeof errorDiagnostico === 'function') {
          errorDiagnostico('capture', code, side, landmark);
        }
        return false;
      };
      if (!Array.isArray(hand) || hand.length !== 21) {
        return fail('hand_landmarks_incomplete');
      }
      const puntos = hand.map(webCoord);
      const nonFinite = puntos.findIndex((p) => !webFinito(p));
      if (nonFinite >= 0) return fail('point_non_finite', nonFinite);
      // Wrist must be in view; tips may leave a small margin at frame edge.
      if (!puntoEnCuadroWeb(puntos[0])) return fail('wrist_out_of_frame', 0);
      const dentro = puntos.filter((p) => p.x >= -kMargenManoWeb &&
        p.x <= 1 + kMargenManoWeb && p.y >= -kMargenManoWeb &&
        p.y <= 1 + kMargenManoWeb).length;
      if (dentro < 15) {
        const outside = puntos.findIndex((p) => p.x < -kMargenManoWeb ||
          p.x > 1 + kMargenManoWeb || p.y < -kMargenManoWeb ||
          p.y > 1 + kMargenManoWeb);
        return fail('hand_out_of_frame', outside >= 0 ? outside : null);
      }
      const escala = Math.hypot(puntos[9].x - puntos[0].x,
        puntos[9].y - puntos[0].y);
      if (!Number.isFinite(escala) || escala < 0.015 || escala > 0.65) {
        return fail('hand_scale_invalid', 9);
      }
      // Each connection must stay plausible relative to middle-MCP scale.
      // This catches landmark swaps/spikes while tolerating open/closed hands.
      for (const [a, b] of kConexionesManoWeb) {
        const d = webDistancia(puntos[a], puntos[b]);
        if (!Number.isFinite(d) || d < escala * 0.018 ||
            d > escala * 2.2) return fail('hand_segment_invalid', b);
      }
      return true;
    }

    function webPoseGeometriaValida(pose, poseMundo) {
      const falla = (motivo, landmark = null) => {
        if (typeof webCameraState !== 'undefined') {
          webCameraState.validation = motivo;
        }
        if (typeof errorDiagnostico === 'function') {
          errorDiagnostico('capture', motivo, null, landmark);
        }
        return false;
      };
      if (!Array.isArray(pose) || pose.length < 33 ||
          !Array.isArray(poseMundo) || poseMundo.length < 33) {
        return falla('pose-formato');
      }
      const anclas = [11, 12, 23, 24];
      for (const i of anclas) {
        const p = webCoord(pose[i]);
        // Hombros deben estar visibles en imagen; caderas pueden quedar
        // fuera del recorte superior, pero worldLandmarks siguen siendo
        // validos para formar eje vertical del torso.
        const hombroEnMargen = p.x >= -kMargenCuerpoWeb &&
          p.x <= 1 + kMargenCuerpoWeb && p.y >= -kMargenCuerpoWeb &&
          p.y <= 1 + kMargenCuerpoWeb;
        if ((i === 11 || i === 12) &&
            (!webFinito(p) || !hombroEnMargen)) {
          return falla('shoulder_out_of_frame', i);
        }
        const visNecesaria = i === 11 || i === 12;
        if (!webFinito(p) || (visNecesaria &&
            (!Number.isFinite(p.visibility) || p.visibility < 0.2)) ||
            !webFinito(webCoord(poseMundo[i]))) {
          return falla('pose_anchor_unsafe', i);
        }
      }
      const mundo = poseMundo.map(webCoord);
      const hombros = webDistancia(mundo[11], mundo[12]);
      if (!Number.isFinite(hombros) || hombros < 1e-3) {
        return falla('hombros-degenerados');
      }
      const segmentos = [[11, 13], [13, 15], [12, 14], [14, 16], [23, 24]];
      for (const [a, b] of segmentos) {
        const d = webDistancia(mundo[a], mundo[b]);
        if (!Number.isFinite(d) || d < hombros * 0.08 ||
            d > hombros * 2.5) return falla('pose_segment_invalid', b);
      }
      const centroHombros = {
        x: (mundo[11].x + mundo[12].x) * 0.5,
        y: (mundo[11].y + mundo[12].y) * 0.5,
        z: (mundo[11].z + mundo[12].z) * 0.5,
      };
      const centroCaderas = {
        x: (mundo[23].x + mundo[24].x) * 0.5,
        y: (mundo[23].y + mundo[24].y) * 0.5,
        z: (mundo[23].z + mundo[24].z) * 0.5,
      };
      const tronco = webDistancia(centroHombros, centroCaderas);
      if (!Number.isFinite(tronco) || tronco <= hombros * 0.25 ||
          tronco >= hombros * 4.0) return falla('tronco-invalido');
      return true;
    }

    function webResta(a, b) {
      return [a.x - b.x, a.y - b.y, a.z - b.z];
    }

    function webPuntoResta(a, b) {
      return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    }

    function webLargo(a) {
      return Math.hypot(a[0], a[1], a[2]);
    }

    function webUnitario(a) {
      const m = webLargo(a);
      return m < 1e-6 ? null : [a[0] / m, a[1] / m, a[2] / m];
    }

    function webPto(a, b) {
      return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    function webCruz(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0],
      ];
    }

    function webBaseCuerpo(world) {
      const hombroI = webCoord(world[11]);
      const hombroD = webCoord(world[12]);
      const caderaI = webCoord(world[23]);
      const caderaD = webCoord(world[24]);
      if (!webFinito(hombroI) || !webFinito(hombroD) ||
          !webFinito(caderaI) || !webFinito(caderaD)) {
        return null;
      }
      const escala = webLargo(webResta(hombroD, hombroI));
      if (!Number.isFinite(escala) || escala < 1e-6) return null;

      const derecha = webUnitario(webResta(hombroD, hombroI));
      if (!derecha) return null;
      const origen = [
        (hombroI.x + hombroD.x) * 0.5,
        (hombroI.y + hombroD.y) * 0.5,
        (hombroI.z + hombroD.z) * 0.5,
      ];
      const centroCaderas = [
        (caderaI.x + caderaD.x) * 0.5,
        (caderaI.y + caderaD.y) * 0.5,
        (caderaI.z + caderaD.z) * 0.5,
      ];
      const tronco = webPuntoResta(
        origen, centroCaderas);
      const arriba = webUnitario([
        tronco[0] - derecha[0] * webPto(tronco, derecha),
        tronco[1] - derecha[1] * webPto(tronco, derecha),
        tronco[2] - derecha[2] * webPto(tronco, derecha),
      ]);
      if (!arriba) return null;
      const frente = webUnitario(webCruz(arriba, derecha));
      if (!frente) return null;
      return { derecha, arriba, frente, origen, escala };
    }

    function webProyectar(base, punto) {
      const p = webCoord(punto);
      if (!webFinito(p)) return null;
      const q = [
        p.x - base.origen[0],
        p.y - base.origen[1],
        p.z - base.origen[2],
      ];
      return [
        webPto(q, base.derecha) / base.escala,
        webPto(q, base.arriba) / base.escala,
        webPto(q, base.frente) / base.escala,
      ];
    }

    /**
     * Espejo JS de normalizeFrame() en sign_norm.dart/sign_norm.py.
     * Entrada: resultados crudos de PoseLandmarker y HandLandmarker.
     * Salida: vector MotionFrameV2, exactamente 152 valores o null.
     */
    function normalizarFrameWeb(pose, poseMundo, left, right,
      renderWrists = null) {
      webCameraState.validation = '';
      if (!Array.isArray(pose) || pose.length < 33 ||
          !Array.isArray(poseMundo) || poseMundo.length < 33) {
        errorDiagnostico('capture', 'pose_format');
        return null;
      }
      const ls = webCoord(pose[11]);
      const rs = webCoord(pose[12]);
      if (!webFinito(ls) || !webFinito(rs) ||
          ls.visibility < 0.5 || rs.visibility < 0.5) {
        errorDiagnostico('capture', 'shoulder_confidence_low');
        return null;
      }

      const bodyIdx = [11, 12, 13, 14, 15, 16, 23, 24];
      if (bodyIdx.some((i) => !webFinito(webCoord(poseMundo[i])))) {
        errorDiagnostico('capture', 'pose_world_non_finite');
        return null;
      }
      if (!webPoseGeometriaValida(pose, poseMundo)) {
        if (!webCameraState.validation) webCameraState.validation = 'pose-geometria';
        return null;
      }
      const base = webBaseCuerpo(poseMundo);
      if (!base) return null;

      const dx = rs.x - ls.x;
      const dy = rs.y - ls.y;
      const escalaImg = Math.hypot(dx, dy);
      if (escalaImg < 1e-6) return null;
      const cosT = dx / escalaImg;
      const sinT = dy / escalaImg;
      const out = Array(152).fill(0);

      for (let i = 0; i < bodyIdx.length; i++) {
        const q = webProyectar(base, poseMundo[bodyIdx[i]]);
        if (!q) return null;
        out[i * 3] = q[0];
        out[i * 3 + 1] = q[1];
        out[i * 3 + 2] = q[2];
      }

      const manos = [
        [left, 'left', 24, 30, 32, 15],
        [right, 'right', 27, 31, 92, 16],
      ];
      for (const [rawHand, side, offLoc, offPres, offShape, poseWrist] of manos) {
        if (!Array.isArray(rawHand) || rawHand.length !== 21) continue;
        const hand = rawHand.map(webCoord);
        if (!webManoUtilizable(hand, side)) {
          webCameraState.validation = 'mano-geometria';
          continue;
        }
        const q = webProyectar(base, poseMundo[poseWrist]);
        if (!q) continue;
        // Pose wrist can lag one or two inference frames. Render position
        // follows stabilized hand wrist, while semantic vector keeps raw pose
        // wrist above. Project image residual into body axes, bounded.
        const stableWrist = webCoord(renderWrists?.[side]);
        const poseWristImage = webCoord(pose?.[poseWrist]);
        if (webFinito(stableWrist) && webFinito(poseWristImage)) {
          const imageDx = (stableWrist.x - poseWristImage.x) / escalaImg;
          const imageDy = (stableWrist.y - poseWristImage.y) / escalaImg;
          const bodyDx = imageDx * cosT + imageDy * sinT;
          const bodyDy = -imageDx * sinT + imageDy * cosT;
          q[0] += Math.max(-.75, Math.min(.75, bodyDx));
          q[1] += Math.max(-.75, Math.min(.75, bodyDy));
        }
        out[offLoc] = q[0];
        out[offLoc + 1] = q[1];
        out[offLoc + 2] = q[2];
        out[offPres] = 1;

        const w = hand[0];
        const m = hand[9];
        let escalaMano = Math.hypot(m.x - w.x, m.y - w.y);
        if (escalaMano < 1e-6) escalaMano = escalaImg * 0.25;
        for (let j = 1; j < 21; j++) {
          const p = hand[j];
          const qx = p.x - w.x;
          const qy = p.y - w.y;
          const k = offShape + (j - 1) * 3;
          out[k] = (qx * cosT + qy * sinT) / escalaMano;
          out[k + 1] = (-qx * sinT + qy * cosT) / escalaMano;
          out[k + 2] = (p.z - w.z) / escalaMano;
        }
      }
      return out.every(Number.isFinite) ? out : null;
    }

    window.normalizarFrameWeb = normalizarFrameWeb;

    function pintarOverlayWeb(pose, left, right) {
      const video = document.getElementById('camaraVideo');
      const canvas = document.getElementById('camaraOverlay');
      if (!video || !canvas || !video.videoWidth || !video.videoHeight) return;
      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      diagnosticOverlayPoints = [];
      ctx.lineWidth = Math.max(2, canvas.width / 320);
      ctx.strokeStyle = '#44e37a';
      ctx.fillStyle = '#44e37a';
      const pxy = (p) => {
        const q = webCoord(p);
        return puntoEnCuadroWeb(q)
          ? [q.x * canvas.width, q.y * canvas.height] : null;
      };
      const line = (a, b, color) => {
        const pa = pxy(a), pb = pxy(b);
        if (!pa || !pb) return;
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(pa[0], pa[1]);
        ctx.lineTo(pb[0], pb[1]);
        ctx.stroke();
      };
      const dot = (p, color, stream = 'pose', side = null, landmark = null) => {
        const q = pxy(p);
        if (!q) return;
        const issue = diagnosticPointIssues.find((item) =>
          item.side === side && item.landmark === landmark);
        const diagnosticColor = issue?.status === 'yellow' ? '#f5b400' :
          issue ? '#e32636' : webCameraState.quality < .55 ? '#f5b400' : '#24b35a';
        ctx.fillStyle = diagnosticoActivo ? diagnosticColor : color;
        ctx.beginPath();
        ctx.arc(q[0], q[1], Math.max(2, canvas.width / 160), 0, Math.PI * 2);
        ctx.fill();
        if (diagnosticoActivo) diagnosticOverlayPoints.push({
          x: q[0], y: q[1], stream, side, landmark,
          code: issue?.code ?? (webCameraState.quality < .55 ? 'confidence_low' : 'valid'),
        });
      };
      const label = (p, text, color) => {
        const q = pxy(p);
        if (!q) return;
        ctx.fillStyle = color;
        ctx.font = `bold ${Math.max(11, canvas.width / 30)}px sans-serif`;
        ctx.fillText(text, q[0] + 5, q[1] - 5);
      };
      const poseEdges = [
        [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
        [11, 23], [12, 24], [23, 24],
      ];
      for (const [a, b] of poseEdges) line(pose?.[a], pose?.[b], '#44e37a');
      // Colores I/D trazan cadena anatómica Pose -> mano. No representan
      // lado visual de pantalla y permiten detectar inversión de orientación.
      for (const [shoulder, elbow, wrist, color, shoulderLabel, wristLabel] of [
        [11, 13, 15, '#ff9f43', 'H-I', 'I'],
        [12, 14, 16, '#62b7ff', 'H-D', 'D'],
      ]) {
        line(pose?.[shoulder], pose?.[elbow], color);
        line(pose?.[elbow], pose?.[wrist], color);
        label(pose?.[shoulder], shoulderLabel, color);
        label(pose?.[wrist], wristLabel, color);
      }
      for (const [hand, etiqueta, color] of [
        [left, 'I', '#ff9f43'], [right, 'D', '#62b7ff'],
      ]) {
        if (!hand) continue;
        const handEdges = [
          [0, 1], [1, 2], [2, 3], [3, 4],
          [0, 5], [5, 6], [6, 7], [7, 8],
          [0, 9], [9, 10], [10, 11], [11, 12],
          [0, 13], [13, 14], [14, 15], [15, 16],
          [0, 17], [17, 18], [18, 19], [19, 20],
          [5, 9], [9, 13], [13, 17],
        ];
        for (const [a, b] of handEdges) line(hand[a], hand[b], color);
        for (let index = 0; index < hand.length; index++) {
          dot(hand[index], color, 'hand', etiqueta === 'I' ? 'left' : 'right', index);
        }
        const muñeca = pxy(hand[0]);
        if (muñeca) {
          ctx.fillStyle = color;
          ctx.font = `bold ${Math.max(12, canvas.width / 24)}px sans-serif`;
          ctx.fillText(etiqueta, muñeca[0] + 6, muñeca[1] - 6);
        }
      }
      if (pose) {
        for (let index = 0; index < pose.length; index++) {
          dot(pose[index], '#44e37a', 'pose', null, index);
        }
      }
    }

    function pintarEstadoCamaraWeb() {
      const estado = document.getElementById('camaraEstado');
      const stats = document.getElementById('camaraStats');
      const iniciar = document.getElementById('bIniciarCamara');
      const detener = document.getElementById('bDetenerCamara');
      const grabar = document.getElementById('bGrabarCamara');
      const repetir = document.getElementById('bRepetirCamara');
      const descargar = document.getElementById('bDescargarCamara');
      if (!estado || !stats || !iniciar || !detener ||
          !grabar || !repetir || !descargar) return;
      const s = webCameraState;
      estado.className = 'camaraEstado' +
        (s.error || s.detectorError ? ' error' : s.running ? ' ok' : '');
      estado.textContent = s.loading ? 'Cargando…' : s.error || s.detectorError ? 'Error' :
        s.running ? 'Activa' : s.detectorsLoading ? 'Detectores…' : 'Apagada';
      iniciar.disabled = s.loading || s.running;
      detener.disabled = !s.running && !s.loading;
      grabar.disabled = !s.running || s.recording;
      repetir.disabled = !webUltimaSecuencia;
      descargar.disabled = !webUltimaSecuencia;
      const calidad = s.quality > 0 ? Math.round(s.quality * 100) + '%' : '—';
      stats.textContent = 'Pose: ' + (s.pose ? 'sí' : 'no') +

        ' FPS (cfg ' + (s.captureFps ? Number(s.captureFps).toFixed(0) : '—') +
        ') · track ' + (s.trackingFps || 0) + ' · pose ' + (s.poseFps || 0) +
        ' · render ' + s.renderFps + ' FPS · M ' +
        Number(s.motionScore ?? 0).toFixed(2) +
        ' · dedos ' + Number(s.fingerMotionScore ?? 0).toFixed(2) +
        (s.motionQuiet ? ' quieto' : ' movimiento') +
        ' · P/H ' + Number(s.poseP95Ms ?? 0).toFixed(1) + '/' +
        Number(s.handP95Ms ?? 0).toFixed(1) + ' ms' +
        ' · proc ' + Number(s.processP95Ms ?? 0).toFixed(1) + ' ms' +
        ' · L ' + Number(s.latencyP50Ms ?? 0).toFixed(1) + '/' +
        Number(s.latencyP95Ms ?? 0).toFixed(1) + '/' +
        Number(s.latencyP99Ms ?? 0).toFixed(1) + ' ms' +
        ' · drop ' + (s.framesSkipped || 0) +
        ' · válidos ' + s.validFrames +
        ' · lados: ' + (s.handAssignmentMode || 'none') +
        ' · stride ' + (s.poseStride || 2) +
        ' · calib ' + (s.calibrationState || 'WARMUP') +
        (s.recording ? ' · grabando ' + s.recordedFrames + '/32' :
          s.lastSequenceFrames ? ' · secuencia lista' : '') +
        (s.stale ? ' · sin tracking' : '') +
        (s.validation ? ' · ' + s.validation : '');
    }

    function siguienteTimestampWeb() {
      // MediaPipe Tasks Web espera reloj monotónico en milisegundos. Usar
      // epoch (~1e12) desborda timestamp interno y detiene CalculatorGraph.
      const ahora = Math.round(performance.now());
      camaraUltimoTimestampMs = Math.max(ahora, camaraUltimoTimestampMs + 1);
      return camaraUltimoTimestampMs;
    }

    const webHandTracker = createHandTrackCoordinator();
    // `hand_assignment_hysteresis` is numeric evidence when continuity holds
    // identity through a transient contradictory arm-chain label.
    let ultimoTrackingWeb = null;
    let ultimoSourceMeta = null;
    const wristDisagreementState = {
      left: {frames: 0, reported: false},
      right: {frames: 0, reported: false},
    };

    function reiniciarDesacuerdoMuñeca() {
      for (const state of Object.values(wristDisagreementState)) {
        state.frames = 0;
        state.reported = false;
      }
    }

    function manosDesdeResultado(resultado, pose, timestampMs = 0) {
      const manos = resultado?.landmarks ?? [];
      const etiquetas = resultado?.handednesses ?? resultado?.handedness ?? [];
      const t = Number(timestampMs);
      const hombroI = webCoord(pose?.[11]);
      const hombroD = webCoord(pose?.[12]);
      const anchoHombros = webFinito(hombroI) && webFinito(hombroD)
        ? Math.max(.05, Math.hypot(
          hombroI.x - hombroD.x, hombroI.y - hombroD.y)) : .4;
      const candidatosCrudos = manos.map((mano, index) => {
        const categoria = etiquetas?.[index]?.[0] ?? {};
        return {
          landmarks: mano,
          side: String(categoria.categoryName ?? ''),
          confidence: Number(categoria.score ?? .5),
        };
      });
      const asignacion = assignHandsByArmChain(candidatosCrudos, {
        leftShoulder: hombroI,
        rightShoulder: hombroD,
        leftElbow: webCoord(pose?.[13]),
        rightElbow: webCoord(pose?.[14]),
        leftWrist: webCoord(pose?.[15]),
        rightWrist: webCoord(pose?.[16]),
        shoulderWidth: anchoHombros,
      });
      webCameraState.handAssignmentMode = asignacion.mode === 'pose_arm_chain' ||
        asignacion.mode === 'ambiguous' ? asignacion.mode : 'pose_pending';
      if (asignacion.mode === 'ambiguous') {
        webCameraState.validation = 'hand_side_ambiguous';
        diagnosticErrors.push({stage: 'association', code: 'hand_side_ambiguous'});
        guardarAudit({
          frame: frameVivoFrameId + 1,
          timestampMs: t || performance.now(),
          stage: 'association', joint: null, score: .5,
          severity: 'warn', state: 'AMBIGUOUS', action: 'hold_track',
          code: 'hand_side_ambiguous',
        });
      }
      const candidatosTrack = candidatosCrudos.map((candidato, index) => {
        const categoria = etiquetas?.[index]?.[0] ?? {};
        const anatomia = resolveAnatomicalHandSide(asignacion, index);
        const completa = webManoUtilizable(candidato.landmarks, anatomia.side);
        return {
          landmarks: completa ? candidato.landmarks : null,
          side: completa ? anatomia.side : null,
          sideLocked: completa && anatomia.sideLocked,
          sideAmbiguous: completa && anatomia.sideAmbiguous,
          confidence: Number(categoria.score ?? .5),
        };
      });
      const poseHint = asignacion.mode === 'pose_arm_chain' ? {
        leftWrist: webCoord(pose?.[15]),
        rightWrist: webCoord(pose?.[16]),
        shoulderWidth: anchoHombros,
      } : null;
      ultimoTrackingWeb = webHandTracker.update(candidatosTrack, poseHint, t);
      diagnosticErrors.push(...ultimoTrackingWeb.diagnostics.errors);
      const trackingErrors = ultimoTrackingWeb.diagnostics.errors;
      webCameraState.leftSurface = ultimoTrackingWeb.left.surface ?? 'unknown';
      webCameraState.rightSurface = ultimoTrackingWeb.right.surface ?? 'unknown';
      webCameraState.handHolds += trackingErrors.filter((error) =>
        error.code === 'hand_position_held' || error.code === 'hand_surface_flip').length;
      webCameraState.handRecoveries += ['left', 'right'].filter((side) =>
        ultimoTrackingWeb[side].recoveryFrames === 2 &&
        trackingErrors.some((error) => error.side === side &&
          error.code === 'hand_recovered')).length;
      webCameraState.handSwaps += trackingErrors.filter((error) =>
        error.code === 'hand_identity_swap').length;
      webCameraState.surfaceFlips =
        (ultimoTrackingWeb.left.surfaceChanges ?? 0) +
        (ultimoTrackingWeb.right.surfaceChanges ?? 0);
      const continuityHeld = ultimoTrackingWeb.diagnostics.errors.some((error) =>
        error.code === 'hand_assignment_hysteresis');
      const wristFusionMode = classifySourceSkew(
        Math.abs(t - (webPoseCache?.timestampMs ?? t))).mode;
      for (const [side, poseIndex] of [['left', 15], ['right', 16]]) {
        const track = ultimoTrackingWeb[side];
        const handWrist = webCoord(track.detected?.[0]);
        const poseWrist = webCoord(pose?.[poseIndex]);
        if (webFinito(handWrist) && webFinito(poseWrist)) {
          const residual = Math.hypot(
            handWrist.x - poseWrist.x, handWrist.y - poseWrist.y) /
            anchoHombros;
          // A cached pose can be up to 120 ms older than hands. Do not call
          // that expected temporal skew a broken union; only direct fusion
          // may raise wrist disagreement.
          const disagreement = residual > .25 && !continuityHeld &&
            wristFusionMode === 'direct';
          const state = wristDisagreementState[side];
          if (disagreement) {
            state.frames++;
            // One crossing or one noisy direct frame is not enough to declare
            // a broken union. Require persistence, then report once per episode.
            if (state.frames >= 3 && !state.reported) {
              state.reported = true;
              errorDiagnostico('fusion', 'wrist_disagreement', side, 0,
                'yellow');
            }
          } else {
            state.frames = 0;
            state.reported = false;
          }
        }
      }
      return {
        // Recognition keeps detector evidence raw. Avatar render consumes
        // stabilized landmarks below, preventing gates from contaminating
        // semantic input while still blocking visual jumps.
        left: ultimoTrackingWeb.left.raw ?? ultimoTrackingWeb.left.detected,
        right: ultimoTrackingWeb.right.raw ?? ultimoTrackingWeb.right.detected,
        renderLeft: ultimoTrackingWeb.left.renderLandmarks,
        renderRight: ultimoTrackingWeb.right.renderLandmarks,
        renderWrists: {
          left: ultimoTrackingWeb.left.renderLandmarks?.[0] ?? null,
          right: ultimoTrackingWeb.right.renderLandmarks?.[0] ?? null,
        },
        tracking: ultimoTrackingWeb,
      };
    }

    function calcularCalidadFrameWeb(pose, poseMundo, left, right) {
      if (!Array.isArray(pose) || pose.length < 33 ||
          !Array.isArray(poseMundo) || poseMundo.length < 33) return 0;
      const cuerpo = [11, 12, 13, 14, 15, 16, 23, 24]
        .map((i) => webCoord(pose[i]).visibility);
      if (cuerpo.some((v) => !Number.isFinite(v))) return 0;
      // El mínimo es demasiado sensible: un codo parcialmente tapado hunde
      // Q aunque hombros y caderas sigan siendo utilizables. Promedio evita
      // ese falso cero y mantiene rango [0,1].
      const visibilidad = Math.max(0, Math.min(1,
        cuerpo.reduce((total, valor) => total + Math.max(0, Math.min(1, valor)), 0)
          / cuerpo.length));
      // Una mano basta para una seña valida. Dos manos suben calidad, pero
      // perder una no degrada frame completo a cero.
      const manos = left && right ? 1 : left || right ? 0.82 : 0.65;
      return Math.max(0, Math.min(1, visibilidad * 0.75 + manos * 0.25));
    }

    function procesarCamaraWeb() {
      if (!webCameraState.running) return;
      const video = document.getElementById('camaraVideo');
      // Diferenciar FPS configurados de FPS reales entregados por la fuente.
      // Un navegador puede negociar 30 FPS y entregar menos frames al video.
      const ahoraEntrada = performance.now();
      const playback = video?.getVideoPlaybackQuality?.();
      if (playback && Number.isFinite(playback.totalVideoFrames)) {
        if (!camaraInputQualityInicio) {
          camaraInputQualityInicio = ahoraEntrada;
          camaraInputQualityFrames = playback.totalVideoFrames;
          camaraInputQualityDropped = Number(playback.droppedVideoFrames) || 0;
        } else if (ahoraEntrada - camaraInputQualityInicio >= 1000) {
          webCameraState.inputFps = Math.max(0, Math.round(
            (playback.totalVideoFrames - camaraInputQualityFrames) * 1000 /
            (ahoraEntrada - camaraInputQualityInicio)));
          camaraInputQualityInicio = ahoraEntrada;
          camaraInputQualityFrames = playback.totalVideoFrames;
        }
        webCameraState.framesSkipped = Math.max(0,
          (Number(playback.droppedVideoFrames) || 0) - camaraInputQualityDropped);
      }
      if (video && video.readyState >= 2 &&
          video.currentTime !== camaraUltimoVideoTime &&
          !webCameraState.processing) {
        camaraUltimoVideoTime = video.currentTime;
        webCameraState.processing = true;
        const processStartedAt = performance.now();
        const timestampMs = siguienteTimestampWeb();
        const sourceFrameId = webCaptureFrameIndex + 1;
        diagnosticPointIssues = [];
        diagnosticErrors = [];
        try {
          // Hands run every accepted frame; pose runs every second frame after
          // first lock. Fast finger response gets priority without losing
          // shoulder-chain identity.
          const ejecutarPose = adaptivePoseScheduler.shouldRun(
            webCaptureFrameIndex, !!webPoseCache);
          const poseStartedAt = performance.now();
          const poseResult = ejecutarPose
            ? poseLandmarkerWeb.detectForVideo(video, timestampMs) : null;
          if (ejecutarPose) {
            registrarTiempoWeb('pose', performance.now() - poseStartedAt);
          }
          const handStartedAt = performance.now();
          const handResult = handLandmarkerWeb.detectForVideo(video, timestampMs);
          registrarTiempoWeb('hand', performance.now() - handStartedAt);
          if (poseResult) {
            webPoseCache = {
              pose: poseResult?.landmarks?.[0] ?? null,
              poseMundo: poseResult?.worldLandmarks?.[0] ?? null,
              timestampMs,
            };
          }
          webCaptureFrameIndex = sourceFrameId;
          const pose = webPoseCache?.pose ?? null;
          const poseMundo = webPoseCache?.poseMundo ?? null;
          const poseTimestampMs = webPoseCache?.timestampMs ?? timestampMs;
          const manos = manosDesdeResultado(handResult, pose, timestampMs);
          const vector = normalizarFrameWeb(
            pose, poseMundo, manos.left, manos.right);
          const vectorRender = normalizarFrameWeb(
            pose, poseMundo,
            manos.renderLeft ?? manos.left,
            manos.renderRight ?? manos.right,
            manos.renderWrists);
          const trackingAccepted = !!manos.left || !!manos.right;
          if (trackingAccepted) camaraTrackingFpsFrames++;
          if (ejecutarPose && poseResult) camaraPoseFpsFrames++;
          webPerformanceMetrics.recordFrame({
            timestampMs,
            sourceFrameId,
            capturedAtMs: timestampMs,
            valid: Array.isArray(vector),
          });
          actualizarMetricasWeb();
          ultimoSourceMeta = {
            pose_t: poseTimestampMs,
            hands_t: timestampMs,
            source_skew_ms: Math.abs(timestampMs - poseTimestampMs),
            tracks: manos.tracking ? {
              left: manos.tracking.left.state,
              right: manos.tracking.right.state,
            } : null,
            association: manos.tracking?.diagnostics ?? null,
            hand_assignment_mode: webCameraState.handAssignmentMode,
            contact: manos.tracking?.contact ?? null,
            hand_points: {
              left: manos.left?.length === 21 ? 21 : 0,
              right: manos.right?.length === 21 ? 21 : 0,
            },
          };
          webCameraState.frames++;
          webCameraState.pose = !!pose && !!poseMundo;
          webCameraState.leftHand = !!manos.left;
          webCameraState.rightHand = !!manos.right;
          webCameraState.leftHandPoints = manos.left?.length === 21 ? 21 : 0;
          webCameraState.rightHandPoints = manos.right?.length === 21 ? 21 : 0;
          webCameraState.lastTimestampMs = timestampMs;
          webCameraState.lastVectorDim = vector?.length ?? 0;
          if (vector) {
            const ahoraValido = performance.now();
            const calidad = calcularCalidadFrameWeb(
              pose, poseMundo, manos.left, manos.right);
            webCameraState.validFrames++;
            webCameraState.quality = calidad;
            webCameraState.lastValidAt = ahoraValido;
            webCameraState.stale = false;
            webCameraState.staleMs = 0;
            frameVivoQuality = calidad;
            frameVivoFrameId++;
            frameVivoSourceFrameId = sourceFrameId;
            frameVivoSourceSkewMs = Math.abs(timestampMs - poseTimestampMs);
            frameVivo = suavizarFrameWeb(vectorRender ?? vector, timestampMs);
            frameVivoTimestampMs = timestampMs;
            procesarCalibracionPulgares(vector, calidad);
            registrarDiagnostico(
              vector, frameVivo, timestampMs, calidad, ultimoSourceMeta);
            if (webCameraState.recording) {
              webGrabacion.push(vector.slice());
              webCameraState.recordedFrames = webGrabacion.length;
              if (webGrabacion.length >= kTFrames) {
                webUltimaSecuencia = webGrabacion.slice(0, kTFrames);
                webCameraState.recording = false;
                webCameraState.lastSequenceFrames = kTFrames;
                pintarEstadoCamaraWeb();
              }
            }
          } else {
            webCameraState.invalidFrames++;
            webCameraState.staleMs = webCameraState.lastValidAt
              ? Math.max(0, performance.now() - webCameraState.lastValidAt) : 0;
            if (!diagnosticErrors.length) {
              errorDiagnostico('capture', webCameraState.validation || 'frame_invalid');
            }
            registrarDiagnostico(null, null, timestampMs, 0);
          }
          pintarOverlayWeb(pose, manos.left, manos.right);

          const ahora = performance.now();
          if (!camaraFpsInicio) camaraFpsInicio = ahora;
          camaraFpsFrames++;
          if (ahora - camaraFpsInicio >= 1000) {
            webCameraState.inferenceFps = camaraFpsFrames;
            webCameraState.trackingFps = camaraTrackingFpsFrames;
            webCameraState.poseFps = camaraPoseFpsFrames;
            camaraFpsFrames = 0;
            camaraTrackingFpsFrames = 0;
            camaraPoseFpsFrames = 0;
            camaraFpsInicio = ahora;
          }
          if (webCameraState.frames % 5 === 0) pintarEstadoCamaraWeb();
          if (diagnosticoActivo && webCameraState.frames % 3 === 0) pintarDiagnostico();
          registrarTiempoWeb('process', performance.now() - processStartedAt);
          webCameraState.poseStride = adaptivePoseScheduler.update(
            performance.now(), {
              processP95Ms: webCameraState.processP95Ms,
              inputFps: webCameraState.inputFps,
            }).stride;
        } catch (e) {
          const error = String(e?.message ?? e);
          webCameraState.running = false;
          void liberarCamaraWeb().catch(() => {}).finally(() => {
            webCameraState.error = error;
            avisar('Error procesando cámara: ' + error);
            pintarEstadoCamaraWeb();
          });
        } finally {
          webCameraState.processing = false;
        }
      }
      if (webCameraState.running) {
        camaraLoopId = requestAnimationFrame(procesarCamaraWeb);
      }
    }

    async function liberarCamaraWeb() {
      cancelAnimationFrame(camaraLoopId);
      if (camaraStream) {
        for (const track of camaraStream.getTracks()) track.stop();
        camaraStream = null;
      }
      const video = document.getElementById('camaraVideo');
      if (video) {
        video.pause();
        video.srcObject = null;
      }
      if (poseLandmarkerWeb) {
        poseLandmarkerWeb.close();
        poseLandmarkerWeb = null;
      }
      if (handLandmarkerWeb) {
        handLandmarkerWeb.close();
        handLandmarkerWeb = null;
      }
      webPoseCache = null;
      webCaptureFrameIndex = 0;
      frameVivo = null;
      frameVivoRecibidoAt = 0;
      frameVivoExterno = false;
      frameVivoStale = false;
      reiniciarFiltroWeb();
      reiniciarNeutralPulgar();
      reiniciarEstadoPerdidaMano();
      if (vrm) posarReposo();
      webCameraState.running = false;
      webCameraState.processing = false;
      webCameraState.detectorsReady = !!preloadedLandmarkersWeb;
      webCameraState.recording = false;
      webCameraState.recordedFrames = 0;
      webCameraState.stale = false;
      webCameraState.staleMs = 0;
      webGrabacion = [];
    }

    async function crearLandmarkersWeb(vision, fileset) {
      const { PoseLandmarker, HandLandmarker } = vision;
      const base = (model, gpu) => ({
        modelAssetPath: model,
        ...(gpu ? { delegate: 'GPU' } : {}),
      });
      let pose = null;
      let hand = null;
      try {
        pose = await PoseLandmarker.createFromOptions(fileset, {
            baseOptions: base(kPoseModelWeb, true),
            runningMode: 'VIDEO',
            numPoses: 1,
            minPoseDetectionConfidence: 0.4,
            minPosePresenceConfidence: 0.4,
            minTrackingConfidence: 0.3,
          });
        hand = await HandLandmarker.createFromOptions(fileset, {
            baseOptions: base(kHandModelWeb, true),
            runningMode: 'VIDEO',
            numHands: 2,
            minHandDetectionConfidence: 0.4,
            minHandPresenceConfidence: 0.4,
            minTrackingConfidence: 0.3,
          });
        return { pose, hand };
      } catch (gpuError) {
        if (pose) pose.close();
        if (hand) hand.close();
        return {
          pose: await PoseLandmarker.createFromOptions(fileset, {
            baseOptions: base(kPoseModelWeb, false),
            runningMode: 'VIDEO',
            numPoses: 1,
            minPoseDetectionConfidence: 0.4,
            minPosePresenceConfidence: 0.4,
            minTrackingConfidence: 0.3,
          }),
          hand: await HandLandmarker.createFromOptions(fileset, {
            baseOptions: base(kHandModelWeb, false),
            runningMode: 'VIDEO',
            numHands: 2,
            minHandDetectionConfidence: 0.4,
            minHandPresenceConfidence: 0.4,
            minTrackingConfidence: 0.3,
          }),
        };
      }
    }

    async function precargarDetectoresWeb() {
      if (!standaloneWeb) return null;
      if (preloadedLandmarkersWeb) {
        webCameraState.detectorsReady = true;
        return preloadedLandmarkersWeb;
      }
      if (detectorWarmupWeb) return detectorWarmupWeb;
      webCameraState.detectorsLoading = true;
      webCameraState.detectorError = null;
      pintarEstadoCamaraWeb();
      detectorWarmupWeb = (async () => {
        const vision = await import(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs');
        const fileset = await vision.FilesetResolver.forVisionTasks(kMediaPipeWasm);
        const tasks = await crearLandmarkersWeb(vision, fileset);
        preloadedLandmarkersWeb = tasks;
        webCameraState.detectorsReady = true;
        return tasks;
      })().catch((error) => {
        webCameraState.detectorsReady = false;
        webCameraState.detectorError = String(error?.message ?? error);
        avisar('Detectores MediaPipe: ' + webCameraState.detectorError);
        throw error;
      }).finally(() => {
        detectorWarmupWeb = null;
        webCameraState.detectorsLoading = false;
        pintarEstadoCamaraWeb();
      });
      return detectorWarmupWeb;
    }

    window.precargarDetectoresWeb = precargarDetectoresWeb;

      if (!webCameraState.running) return;

    function descargarGrabacionWeb() {
      if (!webUltimaSecuencia) return;
      const paquete = {
        schema: 'MotionSequenceV2',
        norm_version: '2.0.0',
        frame_dim: kFrameDim,
        t_frames: kTFrames,
        fps: 30,
        frames: webUltimaSecuencia,
      };
      const blob = new Blob([JSON.stringify(paquete)], {
        type: 'application/json',
      });
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = 'motion_sequence_v2.json';
      enlace.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function solicitarStreamWeb() {
      const solicitud = navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: 'user',
          frameRate: { ideal: 30, max: 60 },
          // 360x270 keeps all 21 points usable; controlled A/B at 320x240
          // increased detector p95 on this host. Real device must still
          // validate 30 FPS target.
          width: { ideal: 360, max: 360 },
          height: { ideal: 270, max: 270 },
        },
      });
      let cancelado = false;
      const vigilante = solicitud.then((stream) => {
        if (cancelado) {
          for (const track of stream.getTracks()) track.stop();
        }
        return stream;
      });
      let temporizador;
      try {
        return await Promise.race([
          vigilante,
          new Promise((_, reject) => {
            temporizador = setTimeout(() => reject(
              new Error('Permiso de cámara pendiente o no concedido.')), 20000);
          }),
        ]);
      } finally {
        cancelado = true;
        clearTimeout(temporizador);
      }
    }

      const y = (event.clientY - rect.top) * canvas.height / rect.height;
      const nearest = diagnosticOverlayPoints.reduce((best, point) => {
        const distance = Math.hypot(point.x - x, point.y - y);
        return !best || distance < best.distance ? {point, distance} : best;
      }, null);
      if (nearest && nearest.distance < Math.max(18, canvas.width / 18)) {
        const point = nearest.point;
        document.getElementById('diagErrores').textContent =
          `${point.stream}:${point.side ?? 'body'}:${point.landmark} — ${point.code}`;
      }
    });

    function frameA3Puntos(v) {
      const pt = (i) => new THREE.Vector3(
        v[kOffBody + i * 3], v[kOffBody + i * 3 + 1], v[kOffBody + i * 3 + 2]);

      const presI = v[kOffPresL] >= 0.5;
      const presD = v[kOffPresR] >= 0.5;
      // Munecas: hay DOS fuentes. kOffLoc* viene del detector de manos y es
      // mas preciso, pero llega en cero cuando esa mano no se detecto -- y el
      // cero es el centro entre los hombros, asi que el brazo se doblaba
      // apuntando al pecho. Las munecas del bloque de cuerpo existen siempre
      // que se vea el cuerpo. Se usa la de la mano si esta, si no la del
      // cuerpo.
      const munI = presI
        ? new THREE.Vector3(v[kOffLocL], v[kOffLocL + 1], v[kOffLocL + 2])
        : pt(kPtMunI);
      const munD = presD
        ? new THREE.Vector3(v[kOffLocR], v[kOffLocR + 1], v[kOffLocR + 2])
        : pt(kPtMunD);

      const manoI = [];
      const manoD = [];
      for (let j = 0; j < 20; j++) {
        manoI.push([v[kOffShapeL + j * 3], v[kOffShapeL + j * 3 + 1], v[kOffShapeL + j * 3 + 2]]);
        manoD.push([v[kOffShapeR + j * 3], v[kOffShapeR + j * 3 + 1], v[kOffShapeR + j * 3 + 2]]);
      }
      return {
        hombroI: pt(kPtHombroI), hombroD: pt(kPtHombroD),
        codoI: pt(kPtCodoI), codoD: pt(kPtCodoD),
        caderaI: pt(kPtCaderaI), caderaD: pt(kPtCaderaD),
        munI, munD, presI, presD, manoI, manoD,
      };
    }

    // Un codo nunca puede estar en el origen: por construccion de
    // sign_norm.dart, el origen es el punto medio entre los hombros. Cuando
    // una sena es de una sola mano, los landmarks del brazo que no participa
    // llegan en cero, y ese cero se colaba como posicion valida. Si el codo
    // cae ahi, el dato no existe y el brazo va a reposo.
    function brazoTieneDatos(codo) {
      return Math.sqrt(codo.x * codo.x + codo.y * codo.y) > 0.05;
    }

    function aplicarFrame(v, meta = {}) {
      if (!vrm || modoManual) return;
      if (!Array.isArray(v) || v.length !== kFrameDim ||
          v.some((value) => !Number.isFinite(Number(value)))) {
        guardarAudit({
          frame: meta.frameId ?? null,
          timestampMs: Number(meta.timestampMs) || performance.now(),
          stage: 'render_ingress', joint: null, score: 0,
          severity: 'error', state: 'REJECTED', action: 'drop_frame',
          code: 'non_finite_transform',
        });
        return;
      }
      const p = frameA3Puntos(v);
      const base = baseCuerpo(p);
      const ahoraMs = typeof performance !== 'undefined' && performance.now
        ? performance.now() : Date.now();
      const brazoIVisible = base && brazoTieneDatos(p.codoI);
      const brazoDVisible = base && brazoTieneDatos(p.codoD);
      const usarManoI = actualizarEstadoPerdidaMano(
        'left', !!brazoIVisible && p.presI, ahoraMs);
      const usarManoD = actualizarEstadoPerdidaMano(
        'right', !!brazoDVisible && p.presD, ahoraMs);
      if (base) aplicarTorso(p, meta);
      if (manosActivas.left) {
        const estado = estadoPerdidaMano.left;
        if (brazoIVisible && p.presI && usarManoI) {
          const frameMeta = estado.recoveryFrames > 0
            ? {...meta, recovery: true} : meta;
          resolverBrazo('left', base, p.hombroI, p.codoI, p.munI, frameMeta);
          moverMano('left', true, p.manoI, frameMeta);
          orientarMuneca('left', true, p.manoI, base, frameMeta);
          estado.recoveryFrames = Math.max(0, estado.recoveryFrames - 1);
        } else if (!brazoIVisible || estado.enReposo) {
          if (!estado.reposoAplicado) {
            posarReposoBrazo('left', meta);
            estado.reposoAplicado = true;
            guardarAudit({
              frame: meta.frameId ?? null,
              timestampMs: Number(meta.timestampMs) || performance.now(),
              stage: 'tracking', joint: 'left:arm', score: 0,
              severity: 'warn', state: 'FROZEN',
              action: 'return_local_chain_to_rest', code: 'arm_or_hand_lost',
            });
          }
        }
      }
      if (manosActivas.right) {
        const estado = estadoPerdidaMano.right;
        if (brazoDVisible && p.presD && usarManoD) {
          const frameMeta = estado.recoveryFrames > 0
            ? {...meta, recovery: true} : meta;
          resolverBrazo('right', base, p.hombroD, p.codoD, p.munD, frameMeta);
          moverMano('right', true, p.manoD, frameMeta);
          orientarMuneca('right', true, p.manoD, base, frameMeta);
          estado.recoveryFrames = Math.max(0, estado.recoveryFrames - 1);
        } else if (!brazoDVisible || estado.enReposo) {
          if (!estado.reposoAplicado) {
            posarReposoBrazo('right', meta);
            estado.reposoAplicado = true;
            guardarAudit({
              frame: meta.frameId ?? null,
              timestampMs: Number(meta.timestampMs) || performance.now(),
              stage: 'tracking', joint: 'right:arm', score: 0,
              severity: 'warn', state: 'FROZEN',
              action: 'return_local_chain_to_rest', code: 'arm_or_hand_lost',
            });
          }
        }
      }
    }

    // Modulo interno: un solo punto de entrada para vivo y replay. El estado
    // del rig queda encapsulado en esta pagina; Dart solo conoce contrato V2.
    const RigBodyEngine = Object.freeze({ aplicarFrame });

    window.reproducirSecuencia = function (seqJson, fps, normVersion) {
      if (normVersion != null && String(normVersion) !== '2.0.0') {
        avisar('norm_version incompatible: ' + normVersion);
        return;
      }
      try {
        colaFrames = JSON.parse(seqJson);
      } catch (e) {
        avisar('secuencia invalida: ' + e);
        return;
      }
      if (!Array.isArray(colaFrames) || colaFrames.length !== kTFrames ||
          colaFrames.some((frame) => !Array.isArray(frame) ||
            frame.length !== kFrameDim ||
            frame.some((value) => !Number.isFinite(Number(value))))) {
        avisar('secuencia incompatible: se requieren 32 frames de 152 valores');
        colaFrames = [];
        return;
      }
      frameActual = 0;
      kFps = Number.isFinite(Number(fps)) && Number(fps) > 0
        ? Math.min(120, Math.max(1, Number(fps))) : 30;
      frameVivo = null;
      frameVivoFrameId = 0;
      frameVivoSourceSkewMs = 0;
      frameVivoRecibidoAt = 0;
      frameVivoExterno = false;
      frameVivoStale = false;
      reiniciarFiltroWeb();
      reiniciarNeutralPulgar();
      reiniciarEstadoPerdidaMano();
      reproduciendo = colaFrames.length > 0;
    };

    // Modo espejo: aplica UN frame al instante, sin cola ni interpolacion.
    // Lo alimenta la camara en vivo (pantalla_espejo.dart). Corta cualquier
    // reproduccion en curso para que no peleen por los mismos huesos.
    window.aplicarFrameVivo = function (frameJson, timestampMs, quality,
        renderFrameJson = null, sourceMetaJson = null) {
      if (!vrm) return;
      let v, renderV = null, sourceMeta = null;
      try {
        v = JSON.parse(frameJson);
        if (renderFrameJson) renderV = JSON.parse(renderFrameJson);
        if (sourceMetaJson) sourceMeta = JSON.parse(sourceMetaJson);
      } catch (e) {
        rigAudit.record(createAuditSnapshot({
          frame: frameVivoFrameId + 1,
          timestampMs: performance.now(),
          stage: 'bridge', joint: null, score: 0, severity: 'error',
          state: 'REJECTED', action: 'drop_frame', code: 'frame_parse_error',
        }));
        return; // un frame suelto que no parsea no merece cartel de error
      }
      if (!Array.isArray(v) || v.length !== kFrameDim ||
          v.some((value) => !Number.isFinite(Number(value)))) {
        rigAudit.record(createAuditSnapshot({
          frame: frameVivoFrameId + 1,
          timestampMs: performance.now(),
          stage: 'bridge', joint: null, score: 0, severity: 'error',
          state: 'REJECTED', action: 'drop_frame', code: 'non_finite_transform',
        }));
        return;
      }
      if (!Array.isArray(renderV) || renderV.length !== kFrameDim ||
          renderV.some((value) => !Number.isFinite(Number(value)))) {
        rigAudit.record(createAuditSnapshot({
          frame: frameVivoFrameId + 1,
          timestampMs: performance.now(),
          stage: 'bridge', joint: null, score: 0, severity: 'error',
          state: 'REJECTED', action: 'fallback_raw_frame',
          code: 'render_non_finite_transform',
        }));
        renderV = v;
      }
      const skew = classifySourceSkew(sourceMeta?.source_skew_ms ?? 0);
      if (skew.mode === 'reject') {
        rigAudit.record(createAuditSnapshot({
          frame: frameVivoFrameId + 1,
          timestampMs: performance.now(),
          stage: 'fusion', joint: null, score: 0, severity: 'error',
          state: 'REJECTED', action: 'drop_frame', code: 'stage_desync',
        }));
        return;
      }
      if (!frameVivoExterno) {
        reiniciarNeutralPulgar();
        reiniciarEstadoPerdidaMano();
      }
      reproduciendo = false;
      colaFrames = [];
      frameVivoTimestampMs = Number(timestampMs) || 0;
      frameVivoFrameId++;
      frameVivoSourceSkewMs = Number(sourceMeta?.source_skew_ms ?? 0);
      frameVivoQuality = Number(quality) || 0;
      frameVivoRecibidoAt = performance.now();
      frameVivoExterno = !standaloneWeb;
      frameVivoStale = false;
      diagnosticPointIssues = [];
      diagnosticErrors = [];
      ultimoTrackingWeb = null;
      ultimoSourceMeta = sourceMeta ?? {
        pose_t: frameVivoTimestampMs,
        hands_t: frameVivoTimestampMs,
        source_skew_ms: 0,
      };
      if (skew.mode === 'project') {
        errorDiagnostico('fusion', 'source_skew', null, null, 'yellow');
      }
      for (const error of sourceMeta?.errors ?? []) {
        if (error?.stage && error?.code) {
          diagnosticErrors.push(error);
          rigAudit.record(createAuditSnapshot({
            frame: frameVivoFrameId + 1,
            timestampMs: frameVivoTimestampMs,
            stage: error.stage,
            joint: error.side ?? null,
            score: 0,
            severity: 'warn',
            state: 'REPORTED', action: 'observe', code: error.code,
          }));
        }
      }
      frameVivo = suavizarFrameWeb(renderV, frameVivoTimestampMs);
      procesarCalibracionPulgares(v, frameVivoQuality);
      registrarDiagnostico(v, frameVivo, frameVivoTimestampMs,
        frameVivoQuality, ultimoSourceMeta);
      if (diagnosticoActivo) pintarDiagnostico();
    };

    // ---------------------------------------------------------------------
    // PANEL DE CALIBRACION (desarrollo).
    //
    // Escribe directo sobre 'cal'. Para quitarlo cuando los valores queden
    // fijos: borrar este bloque, el div #ajustes del body y su CSS.
    // ---------------------------------------------------------------------
    let ladoSel = 'right';
    let modoManual = false;
    let huesoSel = null;
    const $ = (id) => document.getElementById(id);

    // Nombres de huesos en espanol. El spec VRM los da en camelCase y en
    // ingles (leftIndexProximal); se traducen partiendo el nombre en vez de
    // con una tabla de 54 entradas, asi un modelo con huesos extra tampoco
    // queda sin etiqueta.
    const kLadoEs = { left: 'izq.', right: 'der.' };
    const kDedoEs = { thumb: 'Pulgar', index: 'Índice', middle: 'Medio',
                      ring: 'Anular', little: 'Meñique' };
    const kFalangeEs = { metacarpal: 'metacarpo', proximal: 'proximal',
                         intermediate: 'media', distal: 'distal' };
    const kParteEs = {
      hips: 'Cadera', spine: 'Columna', chest: 'Pecho', upperchest: 'Pecho alto',
      neck: 'Cuello', head: 'Cabeza', jaw: 'Mandíbula', eye: 'Ojo',
      shoulder: 'Hombro', upperarm: 'Brazo', lowerarm: 'Antebrazo', hand: 'Mano',
      upperleg: 'Muslo', lowerleg: 'Pierna', foot: 'Pie', toes: 'Dedos del pie',
    };

    function etiquetaHueso(nombre) {
      const partes = nombre.replace(/([A-Z])/g, ' $1').trim().split(' ');
      let lado = '';
      if (partes[0] === 'left' || partes[0] === 'right') {
        lado = ' ' + kLadoEs[partes.shift()];
      }
      const resto = partes.join('').toLowerCase();
      for (const [clave, esp] of Object.entries(kDedoEs)) {
        if (resto.startsWith(clave)) {
          const f = resto.slice(clave.length);
          return `${esp}${lado} · ${kFalangeEs[f] || f}`;
        }
      }
      return (kParteEs[resto] || nombre) + lado;
    }

    // Los huesos que el rig realmente tiene. Se llena al cargar el VRM
    // porque depende del modelo: un avatar sin dedos no debe ofrecerlos.
    function poblarHuesos() {
      const sel = $('selHueso');
      sel.innerHTML = '';
      for (const nombre of Object.values(VRMHumanBoneName)) {
        if (!bone(nombre)) continue;
        const o = document.createElement('option');
        o.value = nombre;
        o.textContent = etiquetaHueso(nombre);
        sel.appendChild(o);
      }
      huesoSel = sel.value || null;
      pintarHueso();
    }

    function pintarHueso() {
      const h = huesoSel ? bone(huesoSel) : null;
      const r = h ? h.rotation : { x: 0, y: 0, z: 0 };
      $('sRx').value = r.x; $('vRx').textContent = r.x.toFixed(2);
      $('sRy').value = r.y; $('vRy').textContent = r.y.toFixed(2);
      $('sRz').value = r.z; $('vRz').textContent = r.z.toFixed(2);
    }

    function escribirHueso() {
      const h = huesoSel ? bone(huesoSel) : null;
      if (!h) return;
      const rotation = [
        Number($('sRx').value), Number($('sRy').value), Number($('sRz').value),
      ];
      const result = aplicarRotacionSegura(h, huesoSel, rotation, {
        timestampMs: performance.now(),
      }, {
        jointLimits: {
          min: [-Math.PI, -Math.PI, -Math.PI],
          max: [Math.PI, Math.PI, Math.PI],
        },
      });
      if (!result?.accepted) {
        pintarHueso();
        return;
      }
      $('vRx').textContent = result.value[0].toFixed(2);
      $('vRy').textContent = result.value[1].toFixed(2);
      $('vRz').textContent = result.value[2].toFixed(2);
    }

    for (const id of ['sRx', 'sRy', 'sRz']) {
      $(id).addEventListener('input', escribirHueso);
    }
    $('selHueso').addEventListener('change', () => {
      huesoSel = $('selHueso').value;
      pintarHueso();
    });
    $('bCero').addEventListener('click', () => {
      const h = huesoSel ? bone(huesoSel) : null;
      if (h) h.rotation.set(0, 0, 0);
      pintarHueso();
    });
    $('bReposo').addEventListener('click', () => { posarReposo(); pintarHueso(); });
    $('bCam').addEventListener('click', resetCamara);

    // Congelar corta aplicarFrame: sin esto, cualquier hueso de brazo o mano
    // que se ajuste a mano lo pisa el frame siguiente, 20 veces por segundo.
    $('bManual').addEventListener('click', () => {
      modoManual = !modoManual;
      $('bManual').classList.toggle('on', modoManual);
      $('bManual').textContent = modoManual ? 'Datos congelados' : 'Congelar datos';
    });

    function pintarPanel() {
      const c = cal[ladoSel];
      $('sPal').value = c.palmaOff;
      $('vPal').textContent = c.palmaOff.toFixed(2);
      $('sRep').value = cal.reposo;
      $('vRep').textContent = cal.reposo.toFixed(2);
      $('vBrazo').textContent = c.zInv > 0 ? '+' : '−';
      $('vDedos').textContent = c.dedos > 0 ? '+' : '−';
      $('vPalS').textContent = c.palmaInv > 0 ? '+' : '−';
      for (const b of document.querySelectorAll('#tabsLado button')) {
        b.classList.toggle('on', b.dataset.lado === ladoSel);
      }
    }

    for (const b of document.querySelectorAll('#tabsLado button')) {
      b.addEventListener('click', () => { ladoSel = b.dataset.lado; pintarPanel(); });
    }
    for (const b of document.querySelectorAll('#tabsVista button')) {
      b.addEventListener('click', () => {
        const v = b.dataset.vista;
        $('vHuesos').classList.toggle('oculto2', v !== 'huesos');
        $('vCalib').classList.toggle('oculto2', v !== 'calib');
        for (const o of document.querySelectorAll('#tabsVista button')) {
          o.classList.toggle('on', o === b);
        }
        if (v === 'huesos') pintarHueso();
      });
    }
    $('sPal').addEventListener('input', () => {
      cal[ladoSel].palmaOff = Number($('sPal').value);
      $('vPal').textContent = cal[ladoSel].palmaOff.toFixed(2);
    });
    $('sMuneca').addEventListener('change', () => {
      cal.usarMuneca = $('sMuneca').checked;
      if (!cal.usarMuneca) {
        ponerMunecaReposo('left');
        ponerMunecaReposo('right');
      }
    });
    $('sRep').addEventListener('input', () => {
      cal.reposo = Number($('sRep').value);
      $('vRep').textContent = cal.reposo.toFixed(2);
    });
    // Los tres invertibles. El del brazo re-aplica la pose de reposo para
    // que no quede contradiciendo a la reproduccion.
    $('bBrazo').addEventListener('click', () => {
      cal[ladoSel].zInv *= -1; posarReposoBrazo(ladoSel); pintarPanel();
    });
    $('bDedos').addEventListener('click', () => {
      cal[ladoSel].dedos *= -1; pintarPanel();
    });
    $('bPalma').addEventListener('click', () => {
      cal[ladoSel].palmaInv *= -1; pintarPanel();
    });
    $('tog').addEventListener('click', () => {
      const p = $('ajustes');
      p.classList.toggle('oculto');
      $('tog').textContent = p.classList.contains('oculto') ? '+' : '–';
    });

    // Arma el volcado completo del estado actual: la calibracion como
    // literal para pegar en 'cal', y todos los huesos fuera de cero con sus
    // tres angulos.
    function volcarPose() {
      const f = (o) => `{ zInv: ${o.zInv}, ` +
        `dedos: ${o.dedos}, palmaInv: ${o.palmaInv}, ` +
        `palmaOff: ${o.palmaOff.toFixed(2)} }`;
      const lineas = [
        `reposo: ${cal.reposo.toFixed(2)},`,
        `usarMuneca: ${cal.usarMuneca},`,
        `left:  ${f(cal.left)},`,
        `right: ${f(cal.right)},`,
        '--- huesos movidos (x, y, z en radianes) ---',
      ];
      for (const nombre of Object.values(VRMHumanBoneName)) {
        const h = bone(nombre);
        if (!h) continue;
        const r = h.rotation;
        if (Math.abs(r.x) < 0.01 && Math.abs(r.y) < 0.01 && Math.abs(r.z) < 0.01) continue;
        lineas.push(`${nombre}: ${r.x.toFixed(3)}, ${r.y.toFixed(3)}, ${r.z.toFixed(3)}`);
      }
      return lineas.join('\n');
    }

    // Manda la pose a Dart, que la copia al portapapeles. Transcribir a mano
    // desde un textarea en un telefono no es viable, y ese era justo el
    // cuello de botella del flujo: componer la pose es facil, sacarla no.
    // El textarea se sigue mostrando como confirmacion visual.
    $('bVer').addEventListener('click', () => {
      const texto = volcarPose();
      $('salida').value = texto;
      $('salida').style.display = 'block';
      if (window.SenasChannel) window.SenasChannel.postMessage('pose:' + texto);
    });

    document.querySelector('#tabsVista button').classList.add('on');
    pintarPanel();

    let ultimoT = 0;
    let acumMs = 0;
    function animar(t) {
      requestAnimationFrame(animar);
      const dt = ultimoT ? t - ultimoT : 16;
      ultimoT = t;

      if (reproduciendo) {
        acumMs += dt;
        const msPorFrame = 1000 / kFps;
        while (acumMs >= msPorFrame && reproduciendo) {
          acumMs -= msPorFrame;
          if (frameActual >= colaFrames.length) {
            reproduciendo = false;
            posarReposo();
            if (window.SenasChannel) window.SenasChannel.postMessage('fin');
            break;
          }
          RigBodyEngine.aplicarFrame(colaFrames[frameActual], {
            frameId: frameActual + 1,
            timestampMs: frameActual * 1000 / kFps,
          });
          frameActual++;
        }
      } else if (frameVivo) {
        // Último frame gana: render 60 FPS, entrada de tracking ~30 FPS,
        // cero cola y cero retraso acumulado.
        const camaraEnVivo = standaloneWeb && webCameraState.running;
        const streamExternoEnVivo = !standaloneWeb && frameVivoExterno;
        const streamEnVivo = camaraEnVivo || streamExternoEnVivo;
        const ultimoFrameAt = camaraEnVivo
          ? webCameraState.lastValidAt : frameVivoRecibidoAt;
        const staleMs = streamEnVivo && ultimoFrameAt
          ? Math.max(0, performance.now() - ultimoFrameAt) : 0;
        webCameraState.staleMs = staleMs;
        if (streamEnVivo && staleMs > kFrameStaleMs) {
          // Una oclusión breve conserva la última pose; después del margen,
          // volver a reposo evita dejar avatar congelado para siempre.
          if (!frameVivoStale) {
            frameVivoStale = true;
            webCameraState.stale = true;
            reiniciarEstadoPerdidaMano();
            posarReposo();
          }
        } else {
          frameVivoStale = false;
          webCameraState.stale = false;
          RigBodyEngine.aplicarFrame(frameVivo, {
            frameId: frameVivoFrameId,
            timestampMs: frameVivoTimestampMs,
            sourceSkewMs: frameVivoSourceSkewMs,
          });
          if (standaloneWeb && frameVivoSourceFrameId > 0 &&
              frameVivoSourceFrameId !== ultimoSourceFrameRenderizado) {
            webPerformanceMetrics.recordFrame({
              timestampMs: frameVivoTimestampMs,
              sourceFrameId: frameVivoSourceFrameId,
              capturedAtMs: frameVivoTimestampMs,
              renderedAtMs: t,
              valid: true,
            });
            ultimoSourceFrameRenderizado = frameVivoSourceFrameId;
            actualizarMetricasWeb();
          }
        }
      }

      moverExpresionBasica(t / 1000);
      orbita.update();
      // three-vrm NO aplica solo lo que se escribe en los huesos
      // normalizados ni en el expressionManager. vrm.update() es lo que
      // baja las rotaciones al rig real y los valores de expresion a los
      // morph targets. Sin esta linea el modelo se queda clavado en la
      // pose de bind (T-pose, brazos en cruz) haga lo que haga el resto
      // del codigo -- posarReposo, el IK y el parpadeo se escriben pero
      // nunca se ven. Va despues de aplicarFrame/moverExpresionBasica y
      // antes de render.
      const renderStartedAt = performance.now();
      if (vrm) vrm.update(dt / 1000);
      renderer.render(scene, camera);
      if (standaloneWeb) {
        registrarTiempoWeb('render', performance.now() - renderStartedAt);
      }
      if (!renderFpsInicio) renderFpsInicio = t;
      renderFpsFrames++;
      if (t - renderFpsInicio >= 1000) {
        webCameraState.renderFps = renderFpsFrames;
        renderFpsFrames = 0;
        renderFpsInicio = t;
      }
    }
    requestAnimationFrame(animar);
  </script>
</body>
