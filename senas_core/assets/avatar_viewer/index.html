          }
          pintarOverlayWeb(pose, manos.left, manos.right);

          const ahora = performance.now();
          if (!camaraFpsInicio) camaraFpsInicio = ahora;
          camaraFpsFrames++;
          if (ahora - camaraFpsInicio >= 1000) {
            webCameraState.inferenceFps = camaraFpsFrames;
            camaraFpsFrames = 0;
            camaraFpsInicio = ahora;
          }
          if (webCameraState.frames % 5 === 0) pintarEstadoCamaraWeb();
        } catch (e) {
          const error = String(e?.message ?? e);
          webCameraState.running = false;
          void liberarCamaraWeb().catch(() => {}).finally(() => {
            webCameraState.error = error;
            pintarEstadoCamaraWeb();
          });
        } finally {
          webCameraState.processing = false;
        }
      }
      if (webCameraState.running) {
        camaraLoopId = requestAnimationFrame(procesarCamaraWeb);
      }
    }

    async function liberarCamaraWeb() {
      cancelAnimationFrame(camaraLoopId);
      if (camaraStream) {
        for (const track of camaraStream.getTracks()) track.stop();
        camaraStream = null;
      }
      const video = document.getElementById('camaraVideo');
      if (video) {
        video.pause();
        video.srcObject = null;
      }
      if (poseLandmarkerWeb) {
        poseLandmarkerWeb.close();
        poseLandmarkerWeb = null;
      }
      if (handLandmarkerWeb) {
        handLandmarkerWeb.close();
        handLandmarkerWeb = null;
      }
      frameVivo = null;
      frameVivoRecibidoAt = 0;
      frameVivoExterno = false;
      frameVivoStale = false;
      reiniciarFiltroWeb();
      reiniciarNeutralPulgar();
      reiniciarEstadoPerdidaMano();
      if (vrm) posarReposo();
      webCameraState.running = false;
      webCameraState.processing = false;
      webCameraState.recording = false;
      webCameraState.recordedFrames = 0;
      webCameraState.stale = false;
      webCameraState.staleMs = 0;
      webGrabacion = [];
    }

    async function crearLandmarkersWeb(vision, fileset) {
      const { PoseLandmarker, HandLandmarker } = vision;
      const base = (model, gpu) => ({
        modelAssetPath: model,
        ...(gpu ? { delegate: 'GPU' } : {}),
      });
      let pose = null;
      let hand = null;
      try {
        pose = await PoseLandmarker.createFromOptions(fileset, {
            baseOptions: base(kPoseModelWeb, true),
            runningMode: 'VIDEO',
            numPoses: 1,
            minPoseDetectionConfidence: 0.4,
            minPosePresenceConfidence: 0.4,
            minTrackingConfidence: 0.3,
          });
        hand = await HandLandmarker.createFromOptions(fileset, {
            baseOptions: base(kHandModelWeb, true),
            runningMode: 'VIDEO',
            numHands: 2,
            minHandDetectionConfidence: 0.4,
            minHandPresenceConfidence: 0.4,
            minTrackingConfidence: 0.3,
          });
        return { pose, hand };
      } catch (gpuError) {
        if (pose) pose.close();
        if (hand) hand.close();
        return {
          pose: await PoseLandmarker.createFromOptions(fileset, {
            baseOptions: base(kPoseModelWeb, false),
            runningMode: 'VIDEO',
            numPoses: 1,
            minPoseDetectionConfidence: 0.4,
            minPosePresenceConfidence: 0.4,
            minTrackingConfidence: 0.3,
          }),
          hand: await HandLandmarker.createFromOptions(fileset, {
            baseOptions: base(kHandModelWeb, false),
            runningMode: 'VIDEO',
            numHands: 2,
            minHandDetectionConfidence: 0.4,
            minHandPresenceConfidence: 0.4,
            minTrackingConfidence: 0.3,
          }),
        };
      }
    }

    function iniciarGrabacionWeb() {
      if (!webCameraState.running) return;
      webGrabacion = [];
      webCameraState.recording = true;
      webCameraState.recordedFrames = 0;
      webCameraState.lastSequenceFrames = 0;
      pintarEstadoCamaraWeb();
    }

    function repetirGrabacionWeb() {
      if (!webUltimaSecuencia) return;
      window.reproducirSecuencia(
        JSON.stringify(webUltimaSecuencia), 30, '2.0.0');
    }

    function descargarGrabacionWeb() {
      if (!webUltimaSecuencia) return;
      const paquete = {
        schema: 'MotionSequenceV2',
        norm_version: '2.0.0',
        frame_dim: kFrameDim,
        t_frames: kTFrames,
        fps: 30,
        frames: webUltimaSecuencia,
      };
      const blob = new Blob([JSON.stringify(paquete)], {
        type: 'application/json',
      });
      const url = URL.createObjectURL(blob);
      const enlace = document.createElement('a');
      enlace.href = url;
      enlace.download = 'motion_sequence_v2.json';
      enlace.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function solicitarStreamWeb() {
      const solicitud = navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: 'user',
          width: { ideal: 640 },
          height: { ideal: 480 },
        },
      });
      let cancelado = false;
      const vigilante = solicitud.then((stream) => {
        if (cancelado) {
          for (const track of stream.getTracks()) track.stop();
        }
        return stream;
      });
      let temporizador;
      try {
        return await Promise.race([
          vigilante,
          new Promise((_, reject) => {
            temporizador = setTimeout(() => reject(
              new Error('Permiso de cámara pendiente o no concedido.')), 20000);
          }),
        ]);
      } finally {
        cancelado = true;
        clearTimeout(temporizador);
      }
    }

    window.iniciarCamaraWeb = async function () {
      if (!standaloneWeb || webCameraState.running || webCameraState.loading) {
        return false;
      }
      webCameraState.loading = true;
      webCameraState.error = null;
      pintarEstadoCamaraWeb();
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error('Este navegador no expone getUserMedia.');
        }
        camaraStream = await solicitarStreamWeb();
        const video = document.getElementById('camaraVideo');
        video.srcObject = camaraStream;
        await video.play();

        const vision = await import(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs');
        const fileset = await vision.FilesetResolver.forVisionTasks(kMediaPipeWasm);
        const tasks = await crearLandmarkersWeb(vision, fileset);
        poseLandmarkerWeb = tasks.pose;
        handLandmarkerWeb = tasks.hand;
        camaraUltimoVideoTime = -1;
        camaraUltimoTimestampMs = 0;
        camaraFpsInicio = 0;
        camaraFpsFrames = 0;
        webCameraState.loading = false;
        webCameraState.running = true;
        webCameraState.frames = 0;
        webCameraState.validFrames = 0;
        webCameraState.invalidFrames = 0;
        webCameraState.quality = 0;
        webCameraState.stale = false;
        webCameraState.staleMs = 0;
        webCameraState.lastValidAt = 0;
        webCameraState.inferenceFps = 0;
        pintarEstadoCamaraWeb();
        camaraLoopId = requestAnimationFrame(procesarCamaraWeb);
        return true;
      } catch (e) {
        await liberarCamaraWeb();
        webCameraState.loading = false;
        webCameraState.error = String(e?.message ?? e);
        pintarEstadoCamaraWeb();
        avisar('Cámara/MediaPipe: ' + webCameraState.error);
        return false;
      }
    };

    window.detenerCamaraWeb = async function () {
      await liberarCamaraWeb();
      webCameraState.loading = false;
      webCameraState.error = null;
      webCameraState.pose = false;
      webCameraState.leftHand = false;
      webCameraState.rightHand = false;
      webCameraState.lastVectorDim = 0;
      webCameraState.frames = 0;
      webCameraState.validFrames = 0;
      webCameraState.invalidFrames = 0;
      webCameraState.quality = 0;
      webCameraState.stale = false;
      webCameraState.staleMs = 0;
      webCameraState.lastValidAt = 0;
      webCameraState.inferenceFps = 0;
      webCameraState.lastTimestampMs = 0;
      pintarEstadoCamaraWeb();
    };

    if (standaloneWeb) {
      const panel = document.getElementById('camaraPanel');
      const video = document.getElementById('camaraVideo');
      const espejo = document.getElementById('camaraEspejo');
      const controlSuavizar = document.getElementById('camaraSuavizar');
      const controlReposoMano = document.getElementById('camaraReposoMano');
      const iniciar = document.getElementById('bIniciarCamara');
      const detener = document.getElementById('bDetenerCamara');
      const grabar = document.getElementById('bGrabarCamara');
      const repetir = document.getElementById('bRepetirCamara');
      const descargar = document.getElementById('bDescargarCamara');
      panel.style.display = 'block';
      const aplicarEspejoWeb = () => {
        video.classList.toggle('espejo', espejo.checked);
        document.getElementById('camaraOverlay').classList.toggle(
          'espejo', espejo.checked);
      };
      espejo.addEventListener('change', aplicarEspejoWeb);
      aplicarEspejoWeb();
      controlSuavizar.addEventListener('change', () => {
        webCameraState.smoothing = controlSuavizar.checked;
        reiniciarFiltroWeb();
      });
      controlReposoMano.checked = cal.resetHandOnLoss;
      controlReposoMano.addEventListener('change', () => {
        cal.resetHandOnLoss = controlReposoMano.checked;
        reiniciarEstadoPerdidaMano();
      });
      iniciar.addEventListener('click', () => { window.iniciarCamaraWeb(); });
      detener.addEventListener('click', () => { window.detenerCamaraWeb(); });
      grabar.addEventListener('click', iniciarGrabacionWeb);
      repetir.addEventListener('click', repetirGrabacionWeb);
      descargar.addEventListener('click', descargarGrabacionWeb);
      window.addEventListener('beforeunload', () => { liberarCamaraWeb(); });
      pintarEstadoCamaraWeb();
    }

    function frameA3Puntos(v) {
      const pt = (i) => new THREE.Vector3(
        v[kOffBody + i * 3], v[kOffBody + i * 3 + 1], v[kOffBody + i * 3 + 2]);

      const presI = v[kOffPresL] >= 0.5;
      const presD = v[kOffPresR] >= 0.5;
      // Munecas: hay DOS fuentes. kOffLoc* viene del detector de manos y es
      // mas preciso, pero llega en cero cuando esa mano no se detecto -- y el
      // cero es el centro entre los hombros, asi que el brazo se doblaba
      // apuntando al pecho. Las munecas del bloque de cuerpo existen siempre
      // que se vea el cuerpo. Se usa la de la mano si esta, si no la del
      // cuerpo.
      const munI = presI
        ? new THREE.Vector3(v[kOffLocL], v[kOffLocL + 1], v[kOffLocL + 2])
        : pt(kPtMunI);
      const munD = presD
        ? new THREE.Vector3(v[kOffLocR], v[kOffLocR + 1], v[kOffLocR + 2])
        : pt(kPtMunD);

      const manoI = [];
      const manoD = [];
      for (let j = 0; j < 20; j++) {
        manoI.push([v[kOffShapeL + j * 3], v[kOffShapeL + j * 3 + 1], v[kOffShapeL + j * 3 + 2]]);
        manoD.push([v[kOffShapeR + j * 3], v[kOffShapeR + j * 3 + 1], v[kOffShapeR + j * 3 + 2]]);
      }
      return {
        hombroI: pt(kPtHombroI), hombroD: pt(kPtHombroD),
        codoI: pt(kPtCodoI), codoD: pt(kPtCodoD),
        caderaI: pt(kPtCaderaI), caderaD: pt(kPtCaderaD),
        munI, munD, presI, presD, manoI, manoD,
      };
    }

    // Un codo nunca puede estar en el origen: por construccion de
    // sign_norm.dart, el origen es el punto medio entre los hombros. Cuando
    // una sena es de una sola mano, los landmarks del brazo que no participa
    // llegan en cero, y ese cero se colaba como posicion valida. Si el codo
    // cae ahi, el dato no existe y el brazo va a reposo.
    function brazoTieneDatos(codo) {
      return Math.sqrt(codo.x * codo.x + codo.y * codo.y) > 0.05;
    }

    function aplicarFrame(v) {
      if (!vrm || modoManual) return;
      const p = frameA3Puntos(v);
      const base = baseCuerpo(p);
      const ahoraMs = typeof performance !== 'undefined' && performance.now
        ? performance.now() : Date.now();
      const usarManoI = actualizarEstadoPerdidaMano(
        'left', p.presI, ahoraMs);
      const usarManoD = actualizarEstadoPerdidaMano(
        'right', p.presD, ahoraMs);
      if (base) aplicarTorso(p);
      if (manosActivas.left) {
        if (base && brazoTieneDatos(p.codoI)) {
          resolverBrazo('left', base, p.hombroI, p.codoI, p.munI);
          if (usarManoI) {
            moverMano('left', true, p.manoI);
            orientarMuneca('left', true, p.manoI, base);
          }
        } else {
          posarReposoBrazo('left');
        }
      }
      if (manosActivas.right) {
        if (base && brazoTieneDatos(p.codoD)) {
          resolverBrazo('right', base, p.hombroD, p.codoD, p.munD);
          if (usarManoD) {
            moverMano('right', true, p.manoD);
            orientarMuneca('right', true, p.manoD, base);
          }
        } else {
          posarReposoBrazo('right');
        }
      }
    }

    // Modulo interno: un solo punto de entrada para vivo y replay. El estado
    // del rig queda encapsulado en esta pagina; Dart solo conoce contrato V2.
    const RigBodyEngine = Object.freeze({ aplicarFrame });

    window.reproducirSecuencia = function (seqJson, fps, normVersion) {
      if (normVersion != null && String(normVersion) !== '2.0.0') {
        avisar('norm_version incompatible: ' + normVersion);
        return;
      }
      try {
        colaFrames = JSON.parse(seqJson);
      } catch (e) {
        avisar('secuencia invalida: ' + e);
        return;
      }
      if (!Array.isArray(colaFrames) || colaFrames.length !== kTFrames ||
          colaFrames.some((frame) => !Array.isArray(frame) ||
            frame.length !== kFrameDim ||
            frame.some((value) => !Number.isFinite(Number(value))))) {
        avisar('secuencia incompatible: se requieren 32 frames de 152 valores');
        colaFrames = [];
        return;
      }
      frameActual = 0;
      kFps = Number.isFinite(Number(fps)) && Number(fps) > 0
        ? Math.min(120, Math.max(1, Number(fps))) : 30;
      frameVivo = null;
      frameVivoRecibidoAt = 0;
      frameVivoExterno = false;
      frameVivoStale = false;
      reiniciarFiltroWeb();
      reiniciarNeutralPulgar();
      reiniciarEstadoPerdidaMano();
      reproduciendo = colaFrames.length > 0;
    };

    // Modo espejo: aplica UN frame al instante, sin cola ni interpolacion.
    // Lo alimenta la camara en vivo (pantalla_espejo.dart). Corta cualquier
    // reproduccion en curso para que no peleen por los mismos huesos.
    window.aplicarFrameVivo = function (frameJson, timestampMs, quality) {
      if (!vrm) return;
      let v;
      try {
        v = JSON.parse(frameJson);
      } catch (e) {
        return; // un frame suelto que no parsea no merece cartel de error
      }
      if (!Array.isArray(v) || v.length !== kFrameDim ||
          v.some((value) => !Number.isFinite(Number(value)))) return;
      if (!frameVivoExterno) {
        reiniciarNeutralPulgar();
        reiniciarEstadoPerdidaMano();
      }
      reproduciendo = false;
      colaFrames = [];
      frameVivoTimestampMs = Number(timestampMs) || 0;
      frameVivoQuality = Number(quality) || 0;
      frameVivoRecibidoAt = performance.now();
      frameVivoExterno = !standaloneWeb;
      frameVivoStale = false;
      frameVivo = suavizarFrameWeb(v, frameVivoTimestampMs);
    };

    // ---------------------------------------------------------------------
    // PANEL DE CALIBRACION (desarrollo).
    //
    // Escribe directo sobre 'cal'. Para quitarlo cuando los valores queden
    // fijos: borrar este bloque, el div #ajustes del body y su CSS.
    // ---------------------------------------------------------------------
    let ladoSel = 'right';
    let modoManual = false;
    let huesoSel = null;
    const $ = (id) => document.getElementById(id);

    // Nombres de huesos en espanol. El spec VRM los da en camelCase y en
    // ingles (leftIndexProximal); se traducen partiendo el nombre en vez de
    // con una tabla de 54 entradas, asi un modelo con huesos extra tampoco
    // queda sin etiqueta.
    const kLadoEs = { left: 'izq.', right: 'der.' };
    const kDedoEs = { thumb: 'Pulgar', index: 'Índice', middle: 'Medio',
                      ring: 'Anular', little: 'Meñique' };
    const kFalangeEs = { metacarpal: 'metacarpo', proximal: 'proximal',
                         intermediate: 'media', distal: 'distal' };
    const kParteEs = {
      hips: 'Cadera', spine: 'Columna', chest: 'Pecho', upperchest: 'Pecho alto',
      neck: 'Cuello', head: 'Cabeza', jaw: 'Mandíbula', eye: 'Ojo',
      shoulder: 'Hombro', upperarm: 'Brazo', lowerarm: 'Antebrazo', hand: 'Mano',
      upperleg: 'Muslo', lowerleg: 'Pierna', foot: 'Pie', toes: 'Dedos del pie',
    };

    function etiquetaHueso(nombre) {
      const partes = nombre.replace(/([A-Z])/g, ' $1').trim().split(' ');
      let lado = '';
      if (partes[0] === 'left' || partes[0] === 'right') {
        lado = ' ' + kLadoEs[partes.shift()];
      }
      const resto = partes.join('').toLowerCase();
      for (const [clave, esp] of Object.entries(kDedoEs)) {
        if (resto.startsWith(clave)) {
          const f = resto.slice(clave.length);
          return `${esp}${lado} · ${kFalangeEs[f] || f}`;
        }
      }
      return (kParteEs[resto] || nombre) + lado;
    }

    // Los huesos que el rig realmente tiene. Se llena al cargar el VRM
    // porque depende del modelo: un avatar sin dedos no debe ofrecerlos.
    function poblarHuesos() {
      const sel = $('selHueso');
      sel.innerHTML = '';
      for (const nombre of Object.values(VRMHumanBoneName)) {
        if (!bone(nombre)) continue;
        const o = document.createElement('option');
        o.value = nombre;
        o.textContent = etiquetaHueso(nombre);
        sel.appendChild(o);
      }
      huesoSel = sel.value || null;
      pintarHueso();
    }

    function pintarHueso() {
      const h = huesoSel ? bone(huesoSel) : null;
      const r = h ? h.rotation : { x: 0, y: 0, z: 0 };
      $('sRx').value = r.x; $('vRx').textContent = r.x.toFixed(2);
      $('sRy').value = r.y; $('vRy').textContent = r.y.toFixed(2);
      $('sRz').value = r.z; $('vRz').textContent = r.z.toFixed(2);
    }

    function escribirHueso() {
      const h = huesoSel ? bone(huesoSel) : null;
      if (!h) return;
      h.rotation.set(
        Number($('sRx').value), Number($('sRy').value), Number($('sRz').value));
      $('vRx').textContent = Number($('sRx').value).toFixed(2);
      $('vRy').textContent = Number($('sRy').value).toFixed(2);
      $('vRz').textContent = Number($('sRz').value).toFixed(2);
    }

    for (const id of ['sRx', 'sRy', 'sRz']) {
      $(id).addEventListener('input', escribirHueso);
    }
    $('selHueso').addEventListener('change', () => {
      huesoSel = $('selHueso').value;
      pintarHueso();
    });
    $('bCero').addEventListener('click', () => {
      const h = huesoSel ? bone(huesoSel) : null;
      if (h) h.rotation.set(0, 0, 0);
      pintarHueso();
    });
    $('bReposo').addEventListener('click', () => { posarReposo(); pintarHueso(); });
    $('bCam').addEventListener('click', resetCamara);

    // Congelar corta aplicarFrame: sin esto, cualquier hueso de brazo o mano
    // que se ajuste a mano lo pisa el frame siguiente, 20 veces por segundo.
    $('bManual').addEventListener('click', () => {
      modoManual = !modoManual;
      $('bManual').classList.toggle('on', modoManual);
      $('bManual').textContent = modoManual ? 'Datos congelados' : 'Congelar datos';
    });

    function pintarPanel() {
      const c = cal[ladoSel];
      $('sPal').value = c.palmaOff;
      $('vPal').textContent = c.palmaOff.toFixed(2);
      $('sRep').value = cal.reposo;
      $('vRep').textContent = cal.reposo.toFixed(2);
      $('vBrazo').textContent = c.zInv > 0 ? '+' : '−';
      $('vDedos').textContent = c.dedos > 0 ? '+' : '−';
      $('vPalS').textContent = c.palmaInv > 0 ? '+' : '−';
      for (const b of document.querySelectorAll('#tabsLado button')) {
        b.classList.toggle('on', b.dataset.lado === ladoSel);
      }
    }

    for (const b of document.querySelectorAll('#tabsLado button')) {
      b.addEventListener('click', () => { ladoSel = b.dataset.lado; pintarPanel(); });
    }
    for (const b of document.querySelectorAll('#tabsVista button')) {
      b.addEventListener('click', () => {
        const v = b.dataset.vista;
        $('vHuesos').classList.toggle('oculto2', v !== 'huesos');
        $('vCalib').classList.toggle('oculto2', v !== 'calib');
        for (const o of document.querySelectorAll('#tabsVista button')) {
          o.classList.toggle('on', o === b);
        }
        if (v === 'huesos') pintarHueso();
      });
    }
    $('sPal').addEventListener('input', () => {
      cal[ladoSel].palmaOff = Number($('sPal').value);
      $('vPal').textContent = cal[ladoSel].palmaOff.toFixed(2);
    });
    $('sMuneca').addEventListener('change', () => {
      cal.usarMuneca = $('sMuneca').checked;
      if (!cal.usarMuneca) {
        ponerMunecaReposo('left');
        ponerMunecaReposo('right');
      }
    });
    $('sRep').addEventListener('input', () => {
      cal.reposo = Number($('sRep').value);
      $('vRep').textContent = cal.reposo.toFixed(2);
    });
    // Los tres invertibles. El del brazo re-aplica la pose de reposo para
    // que no quede contradiciendo a la reproduccion.
    $('bBrazo').addEventListener('click', () => {
      cal[ladoSel].zInv *= -1; posarReposoBrazo(ladoSel); pintarPanel();
    });
    $('bDedos').addEventListener('click', () => {
      cal[ladoSel].dedos *= -1; pintarPanel();
    });
    $('bPalma').addEventListener('click', () => {
      cal[ladoSel].palmaInv *= -1; pintarPanel();
    });
    $('tog').addEventListener('click', () => {
      const p = $('ajustes');
      p.classList.toggle('oculto');
      $('tog').textContent = p.classList.contains('oculto') ? '+' : '–';
    });

    // Arma el volcado completo del estado actual: la calibracion como
    // literal para pegar en 'cal', y todos los huesos fuera de cero con sus
    // tres angulos.
    function volcarPose() {
      const f = (o) => `{ zInv: ${o.zInv}, ` +
        `dedos: ${o.dedos}, palmaInv: ${o.palmaInv}, ` +
        `palmaOff: ${o.palmaOff.toFixed(2)} }`;
      const lineas = [
        `reposo: ${cal.reposo.toFixed(2)},`,
        `usarMuneca: ${cal.usarMuneca},`,
        `left:  ${f(cal.left)},`,
        `right: ${f(cal.right)},`,
        '--- huesos movidos (x, y, z en radianes) ---',
      ];
      for (const nombre of Object.values(VRMHumanBoneName)) {
        const h = bone(nombre);
        if (!h) continue;
        const r = h.rotation;
        if (Math.abs(r.x) < 0.01 && Math.abs(r.y) < 0.01 && Math.abs(r.z) < 0.01) continue;
        lineas.push(`${nombre}: ${r.x.toFixed(3)}, ${r.y.toFixed(3)}, ${r.z.toFixed(3)}`);
      }
      return lineas.join('\n');
    }

    // Manda la pose a Dart, que la copia al portapapeles. Transcribir a mano
    // desde un textarea en un telefono no es viable, y ese era justo el
    // cuello de botella del flujo: componer la pose es facil, sacarla no.
    // El textarea se sigue mostrando como confirmacion visual.
    $('bVer').addEventListener('click', () => {
      const texto = volcarPose();
      $('salida').value = texto;
      $('salida').style.display = 'block';
      if (window.SenasChannel) window.SenasChannel.postMessage('pose:' + texto);
    });

    document.querySelector('#tabsVista button').classList.add('on');
    pintarPanel();

    let ultimoT = 0;
    let acumMs = 0;
    function animar(t) {
      requestAnimationFrame(animar);
      const dt = ultimoT ? t - ultimoT : 16;
      ultimoT = t;

      if (reproduciendo) {
        acumMs += dt;
        const msPorFrame = 1000 / kFps;
        while (acumMs >= msPorFrame && reproduciendo) {
          acumMs -= msPorFrame;
          if (frameActual >= colaFrames.length) {
            reproduciendo = false;
            posarReposo();
            if (window.SenasChannel) window.SenasChannel.postMessage('fin');
            break;
          }
          RigBodyEngine.aplicarFrame(colaFrames[frameActual]);
          frameActual++;
        }
      } else if (frameVivo) {
        // Último frame gana: render 60 FPS, entrada de tracking ~30 FPS,
        // cero cola y cero retraso acumulado.
        const camaraEnVivo = standaloneWeb && webCameraState.running;
        const streamExternoEnVivo = !standaloneWeb && frameVivoExterno;
        const streamEnVivo = camaraEnVivo || streamExternoEnVivo;
        const ultimoFrameAt = camaraEnVivo
          ? webCameraState.lastValidAt : frameVivoRecibidoAt;
        const staleMs = streamEnVivo && ultimoFrameAt
          ? Math.max(0, performance.now() - ultimoFrameAt) : 0;
        webCameraState.staleMs = staleMs;
        if (streamEnVivo && staleMs > kFrameStaleMs) {
          // Una oclusión breve conserva la última pose; después del margen,
          // volver a reposo evita dejar avatar congelado para siempre.
          if (!frameVivoStale) {
            frameVivoStale = true;
            webCameraState.stale = true;
            reiniciarEstadoPerdidaMano();
            posarReposo();
          }
        } else {
          frameVivoStale = false;
          webCameraState.stale = false;
          RigBodyEngine.aplicarFrame(frameVivo);
        }
      }

      moverExpresionBasica(t / 1000);
      orbita.update();
      // three-vrm NO aplica solo lo que se escribe en los huesos
      // normalizados ni en el expressionManager. vrm.update() es lo que
      // baja las rotaciones al rig real y los valores de expresion a los
      // morph targets. Sin esta linea el modelo se queda clavado en la
      // pose de bind (T-pose, brazos en cruz) haga lo que haga el resto
      // del codigo -- posarReposo, el IK y el parpadeo se escriben pero
      // nunca se ven. Va despues de aplicarFrame/moverExpresionBasica y
      // antes de render.
      if (vrm) vrm.update(dt / 1000);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animar);
  </script>
</body>
</html>
